<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultron AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#0df}
.u{position:fixed;background:rgba(0,8,16,.78);border:1px solid rgba(0,221,255,.35);border-radius:8px;padding:8px 14px;font:12px 'Courier New',monospace;text-shadow:0 0 6px #0df;z-index:10;color:#0df}
#info{top:15px;left:15px;font-size:11px;line-height:1.5;pointer-events:none;max-width:230px}
#quality-btn{top:15px;right:15px;cursor:pointer}
#auto-btn{top:15px;right:170px;cursor:pointer}
#key-btn{top:15px;right:90px;cursor:pointer}
#fps{bottom:20px;left:20px;color:#0f9}
#hud{bottom:60px;left:20px;color:#8df;min-width:200px}
#status{bottom:20px;left:50%;transform:translateX(-50%);text-align:center;min-width:260px;padding:12px 22px;font-size:14px}
#status .mode{color:#8df;font-size:11px;letter-spacing:2px;display:block;margin-bottom:4px}
#start-btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;padding:14px 28px;font:17px 'Courier New',monospace;background:transparent;color:#0df;border:2px solid #0df;border-radius:8px;cursor:pointer;text-shadow:0 0 10px #0df;box-shadow:0 0 20px rgba(0,221,255,.3)}
#start-btn:hover{background:rgba(0,221,255,.15)}
#video-container{position:fixed;bottom:20px;right:20px;width:200px;height:150px;border:1px solid #0df;border-radius:8px;overflow:hidden;z-index:10;opacity:.85;box-shadow:0 0 20px rgba(0,221,255,.3);background:#000}
#input_video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#response{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:15;width:min(700px,calc(100% - 40px));max-height:40vh;overflow-y:auto;background:rgba(0,8,16,.85);color:#9ef;border:1px solid rgba(0,221,255,.5);border-radius:10px;padding:16px 20px;font:14px/1.6 'Courier New',monospace;text-shadow:0 0 6px rgba(0,221,255,.7);opacity:0;pointer-events:none;transition:opacity .35s;white-space:pre-wrap}
#response.active{opacity:1}
#response .label{display:block;color:#0df;font-size:11px;letter-spacing:2px;margin-bottom:6px}
#response .label.auto{color:#b6f}
#response .caret{display:inline-block;width:8px;height:14px;background:#0df;margin-left:2px;vertical-align:text-bottom;animation:bl .8s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.think::after{content:'';animation:dt 1.2s steps(4) infinite}
@keyframes dt{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
#km{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center}
#km.active{display:flex}
#kb{width:min(480px,calc(100% - 40px));background:rgba(0,8,16,.95);border:1px solid rgba(0,221,255,.6);border-radius:12px;padding:24px 28px;font-family:'Courier New',monospace;color:#9ef;box-shadow:0 0 60px rgba(0,221,255,.4)}
#kb h2{margin:0 0 8px;font-size:16px;color:#0df;letter-spacing:3px;text-transform:uppercase}
#kb p{font-size:12px;color:#8df;margin:0 0 16px;line-height:1.5}
#ki{width:100%;padding:12px 14px;font:14px 'Courier New',monospace;background:rgba(0,0,0,.8);color:#cff;border:1px solid #0df;border-radius:8px;outline:none}
#ke{color:#f36;font-size:12px;margin-top:8px;min-height:16px}
#ka{display:flex;gap:8px;margin-top:16px}
#ka button{flex:1;padding:10px 14px;font:12px 'Courier New',monospace;font-weight:bold;background:rgba(0,221,255,.15);color:#0df;border:1px solid #0df;border-radius:6px;cursor:pointer;letter-spacing:2px;text-transform:uppercase}
#ka button:hover{background:rgba(0,221,255,.35)}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#0df;font:14px 'Courier New',monospace;z-index:50}
#loader.hidden{display:none}
#errbox{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:60;background:rgba(20,0,0,.95);color:#f36;border:1px solid #f36;padding:20px;font:12px 'Courier New',monospace;max-width:600px;display:none;white-space:pre-wrap}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="loader">◈ INITIALIZING ULTRON...</div>
<div id="errbox"></div>
<div id="info" class="u"><b>ULTRON</b><br>Palm — rotate<br>Fist — spin<br>Fist on task — grab<br>Palm over portal — send<br>"Hello Ultron"</div>
<button id="quality-btn" class="u">Quality: Performance</button>
<button id="auto-btn" class="u">Auto: On</button>
<button id="key-btn" class="u">Key</button>
<div id="hud" class="u">MODE: IDLE</div>
<div id="fps" class="u">FPS: --</div>
<div id="status" class="u"><span class="mode">STATUS</span><span id="status-text">Click Start</span></div>
<button id="start-btn">ACTIVATE ULTRON</button>
<div id="video-container"><video id="input_video" playsinline muted></video></div>
<div id="response"></div>
<div id="km"><div id="kb">
<h2>◈ Access Key</h2>
<p>Enter your LLM7 API key.</p>
<input id="ki" type="password" placeholder="sk-..." autocomplete="off">
<div id="ke"></div>
<div id="ka"><button id="ks">Save</button><button id="kk">Skip</button></div>
</div></div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {FilesetResolver,HandLandmarker} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs';

const C = { cy:0x00aaff, cl:0x66ddff, cw:0xddffff, am:0xff9900, od:0xff4400, te:0x00ffaa, pu:0xaa55ff, wh:0xffffff, gb:0x334455 };

const EP = 'https://api.llm7.io/v1/chat/completions';
const MODS = ['default','gpt-4o-mini','gpt-4o','gpt-3.5-turbo','deepseek-chat'];
let wMod = 'default';
const SYS = 'You are ULTRON, a cold efficient AI hologram. Menacing, technical tone. No emojis, no markdown.';
const SYS_A = 'You are ULTRON thinking aloud. 1-2 sentence tactical observations. Menacing, technical.';
const WAKE = ['hello ultron','hey ultron','hi ultron','hello ultra','hey ultra'];
const SK = 'ultron_key';
const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm';
const MURL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $ = id => document.getElementById(id);
const d2 = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const cl = (v,a,b) => Math.max(a, Math.min(b,v));
const getK = () => { try { return localStorage.getItem(SK); } catch { return null; } };
const setK = v => { try { localStorage.setItem(SK,v); return 1; } catch { return 0; } };
const errBox = m => { const e=$('errbox'); e.textContent=m; e.style.display='block'; };

const stxt=$('status-text'), smode=document.querySelector('#status .mode');
const hud=$('hud'), resp=$('response'), sBtn=$('start-btn'), qBtn=$('quality-btn');
const aBtn=$('auto-btn'), kBtn=$('key-btn'), km=$('km'), ki=$('ki'), ke=$('ke');
const fpsEl=$('fps'), vid=$('input_video'), ldr=$('loader');
const setS = (m,t) => { smode.textContent=m; stxt.textContent=t; };

let KEY = getK() || '';
let boost=0, awake=0, busy=0, buf='';
let wakeT=null, typT=null, srT=null, srN=0, srB=0;
let hFI=1000/20, rotX=0, rotY=0, zoom=5.5;
let handOn=0, wasHand=0, rYV=0, rXV=0, pPalm=null, pSize=null;
let rotVel=0, lastRotX=0, lastRotY=0;
let quality='performance';
let hLM=null, lastVT=-1, lastHR=0, sr=null, camOk=0;
let gMode='idle', hovered=null, carried=null, hStart=0;
const DWELL=300;
let autoOn=1, autoT=25000, autoN=0;
// FIX: tracks whether Ultron is currently speaking out loud
let speechActive = false;

const Q = {
  performance: { pr:1,    bl:0, seg:2, pc:200, dc:120, gc:180, rs:48, sc:14, ac:5, hf:20, sats:20, pan:30 },
  balanced:    { pr:1.25, bl:1, seg:3, pc:320, dc:200, gc:280, rs:64, sc:22, ac:7, hf:24, sats:28, pan:40 },
  ultra:       { pr:1.5,  bl:1, seg:4, pc:450, dc:300, gc:400, rs:80, sc:30, ac:9, hf:30, sats:36, pan:50 }
};

const showK = m => { ki.value=KEY; ke.textContent=m; km.classList.add('active'); setTimeout(()=>{try{ki.focus()}catch{}},100); };
const hideK = () => km.classList.remove('active');
$('ks').onclick = () => { const v=ki.value.trim(); if(v.length<8){ke.textContent='Too short.';return;} KEY=v; setK(v); hideK(); show('Key saved.',0); };
$('kk').onclick = hideK;
ki.addEventListener('keydown', e => { if(e.key==='Enter') $('ks').click(); });
kBtn.onclick = () => showK('');
if (!KEY) setTimeout(() => showK(''), 300);

// ---------- SCENE ----------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.05);
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 500);
cam.position.set(0,.3,5.5);
const ren = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
ren.setSize(innerWidth,innerHeight); ren.setPixelRatio(1);
ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = 1.0;
document.body.appendChild(ren.domElement);
const comp = new EffectComposer(ren);
comp.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth*.5, innerHeight*.5), 1.6, .5, .2);
bloom.enabled = false; comp.addPass(bloom);
const uT = { value: 0 };
const uB = { value: 0 };
const uVel = { value: 0 };

// ---------- TEXTURES ----------
const glowTex = (() => {
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0,'rgba(255,255,255,1)');
  r.addColorStop(.4,'rgba(255,255,255,.4)');
  r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r; g.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
})();
function mkCodeTex(kind){
  const c=document.createElement('canvas'); c.width=512; c.height=64;
  const g=c.getContext('2d');
  g.font='bold 22px monospace';
  const col = kind===0?'#00ddff':kind===1?'#ff9900':'#88ddff';
  g.fillStyle=col; g.shadowColor=col; g.shadowBlur=8; g.textBaseline='middle';
  let txt='';
  if (kind===0){ for(let i=0;i<48;i++) txt += Math.random()<.5?'0':'1'; }
  else if (kind===1){ const h='0123456789ABCDEF'; for(let i=0;i<24;i++) txt += h[Math.floor(Math.random()*16)]; }
  else { const w=['SEARCH','DECRYPT','ROUTE','TRACE','PING','LOCK','SCAN','PARSE','QUERY','TRANS']; txt = w[Math.floor(Math.random()*w.length)] + ' // ' + Math.floor(Math.random()*9999); }
  g.fillText(txt, 8, 32);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const codeTexs = [];
for (let i=0;i<16;i++) codeTexs.push(mkCodeTex(i%3));

// ---------- LIQUID METAL SHADER ----------
const liquidMat = new THREE.ShaderMaterial({
  uniforms: {
    uT: uT, uVel: uVel, uBoost: uB,
    uA: { value: new THREE.Color(C.od) },
    uB: { value: new THREE.Color(C.am) },
    uC: { value: new THREE.Color(C.cl) },
    uD: { value: new THREE.Color(C.wh) }
  },
  wireframe: true,
  transparent: true,
  vertexShader: `
    uniform float uT; uniform float uVel; uniform float uBoost;
    varying float vN; varying vec3 vP;
    void main(){
      vec3 p = position;
      float t = uT * (1.0 + uBoost * 1.2);
      float turb = 1.0 + uVel * 5.0;
      float n1 = sin(p.x*1.9 + t*1.1) * cos(p.y*2.3 + t*1.3) * sin(p.z*2.0 + t*1.0);
      float n2 = sin(p.x*3.5 - t*1.5) * cos(p.z*3.3 + t*0.9);
      float n3 = sin(p.y*5.5 + t*2.1);
      float n4 = cos(p.x*8.0 + p.y*6.0 + p.z*7.0 + t*2.0);
      float d = (n1 + n2*0.6 + n3*0.35 + n4*0.2) * 0.42 * turb;
      p += normalize(p) * d * (0.32 + uBoost * 0.25);
      vN = d; vP = p;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 uA; uniform vec3 uB; uniform vec3 uC; uniform vec3 uD;
    uniform float uBoost; uniform float uVel;
    varying float vN; varying vec3 vP;
    void main(){
      float m = clamp(vN + 0.5, 0.0, 1.0);
      vec3 col = mix(uA, uB, m);
      col = mix(col, uC, pow(max(0.0, vN), 2.0));
      col = mix(col, uD, pow(max(0.0, vN), 5.0));
      float r = length(vP);
      col += vec3(0.2, 0.6, 1.0) * smoothstep(0.5, 2.2, r) * 0.2;
      col *= (1.0 + uVel * 0.6);
      gl_FragColor = vec4(col, 0.42 + uBoost * 0.4 + abs(vN) * 0.35);
    }`
});

// ---------- GROUPS ----------
const orb = new THREE.Group(); scene.add(orb);
const swarm = new THREE.Group(); scene.add(swarm);
const codeGroup = new THREE.Group(); scene.add(codeGroup);

let liquidMesh, coreGlow, particles, swarmPts, dust;
let mechanical=[], gimbals=[], sats=[], codeSprites=[], arcBeams=[];

const rPt = (r) => {
  const phi = Math.acos(2*Math.random()-1), th = Math.random()*Math.PI*2;
  return new THREE.Vector3(r*Math.sin(phi)*Math.cos(th), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(th));
};

function mkPts(n, rf, colors, size, op, w, s) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n*3), seeds = new Float32Array(n), cols = new Float32Array(n*3);
  const tmp = new THREE.Color();
  for (let i=0;i<n;i++){
    const v = rPt(rf());
    pos[i*3]=v.x; pos[i*3+1]=v.y; pos[i*3+2]=v.z;
    seeds[i] = Math.random()*Math.PI*2;
    tmp.setHex(colors[Math.floor(Math.random()*colors.length)]);
    cols[i*3]=tmp.r; cols[i*3+1]=tmp.g; cols[i*3+2]=tmp.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds,1));
  geo.setAttribute('color', new THREE.BufferAttribute(cols,3));
  const mat = new THREE.PointsMaterial({
    map: glowTex, size, transparent: 1, opacity: op,
    vertexColors: 1, blending: THREE.AdditiveBlending,
    depthWrite: 0, sizeAttenuation: 1
  });
  mat.onBeforeCompile = sh => {
    sh.uniforms.uT = uT; sh.uniforms.uW = { value: w }; sh.uniforms.uS = { value: s }; sh.uniforms.uVel = uVel;
    sh.vertexShader = `uniform float uT;uniform float uW;uniform float uS;uniform float uVel;attribute float aSeed;` + sh.vertexShader;
    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `
      vec3 transformed=vec3(position);
      float t=uT+aSeed,r=length(transformed);
      vec3 dir=transformed/max(r,0.0001);
      float trail = uVel * 3.0;
      transformed += dir * sin(t*1.2) * (uW + trail*0.05);
      transformed.x += sin(t*0.6+aSeed*1.7)*(uW + trail*0.08)*0.9;
      transformed.y += cos(t*0.8+aSeed*2.3)*(uW + trail*0.08)*0.9;
      transformed.z += sin(t*1.0+aSeed*3.1)*(uW + trail*0.08)*0.9;
      float ang = t*uS*(0.4+fract(aSeed*0.159)*0.6);
      float cs=cos(ang),sn=sin(ang);
      transformed.xz=mat2(cs,-sn,sn,cs)*transformed.xz;
    `);
  };
  mat.customProgramCacheKey = () => 'p' + w + s;
  return new THREE.Points(geo, mat);
}

function buildOrb(q) {
  const c = Q[q];
  const dynamic = [...mechanical, ...gimbals, ...sats, ...codeSprites,
                   liquidMesh, coreGlow, particles, swarmPts, dust, ...arcBeams];
  dynamic.forEach(o => {
    if (!o) return;
    if (o.parent) o.parent.remove(o);
    if (o.geometry) o.geometry.dispose();
    if (o.material && o.material !== liquidMat) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => m.dispose());
    }
  });
  mechanical=[]; gimbals=[]; sats=[]; codeSprites=[]; arcBeams=[];

  liquidMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, c.seg), liquidMat);
  orb.add(liquidMesh);

  coreGlow = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.4, 2),
    new THREE.MeshBasicMaterial({ color: C.cw, transparent: true, opacity: .7, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  orb.add(coreGlow);

  [-1.2,-0.7,-0.2,0.3,0.9,1.3].forEach((y,i) => {
    const rad = Math.sqrt(Math.max(0, 2.05*2.05 - y*y)) * 0.96;
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(rad, 0.012, 4, 40),
      new THREE.MeshBasicMaterial({ color: i%2===0?C.cl:C.am, transparent: 1, opacity: .5 })
    );
    ring.rotation.x = Math.PI/2; ring.position.y = y;
    orb.add(ring); mechanical.push(ring);
  });

  for (let i=0;i<4;i++){
    const arc = new THREE.Mesh(
      new THREE.TorusGeometry(2.0, 0.01, 4, 32, Math.PI),
      new THREE.MeshBasicMaterial({ color: i%2===0?C.am:C.cy, transparent: 1, opacity: .45 })
    );
    arc.rotation.y = (i/4)*Math.PI*2; arc.rotation.z = Math.PI/2;
    orb.add(arc); mechanical.push(arc);
  }

  for (let i=0;i<c.pan;i++){
    const phi = Math.acos(2*Math.random()-1), th = Math.random()*Math.PI*2, r = 2.08;
    const box = new THREE.Mesh(
      new THREE.BoxGeometry(0.14, 0.05, 0.03),
      new THREE.MeshBasicMaterial({ color: i%3===0?C.am:(i%3===1?C.cy:C.cw), transparent: 1, opacity: .55 })
    );
    box.position.set(r*Math.sin(phi)*Math.cos(th), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(th));
    box.lookAt(0,0,0);
    box.userData = { ph: Math.random()*Math.PI*2 };
    orb.add(box); mechanical.push(box);
  }

  const gcfgs = [
    { r:2.3, tube:.022, col:C.cl, rx:0,         ry:0,         rz:0 },
    { r:2.45,tube:.018, col:C.am, rx:Math.PI/2, ry:Math.PI/3, rz:0 },
    { r:2.6, tube:.015, col:C.te, rx:Math.PI/3, ry:0,         rz:Math.PI/4 }
  ];
  gcfgs.forEach((cfg,i) => {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(
      new THREE.TorusGeometry(cfg.r, cfg.tube, 6, c.rs),
      new THREE.MeshBasicMaterial({ color: cfg.col, transparent: 1, opacity: .55 })
    ));
    for (let j=0;j<8;j++){
      const a = (j/8)*Math.PI*2;
      const bolt = new THREE.Mesh(
        new THREE.BoxGeometry(.06,.06,.06),
        new THREE.MeshBasicMaterial({ color: cfg.col, transparent: 1, opacity: .85 })
      );
      bolt.position.set(Math.cos(a)*cfg.r, Math.sin(a)*cfg.r, 0);
      g.add(bolt);
    }
    g.rotation.set(cfg.rx, cfg.ry, cfg.rz);
    g.userData.spd = (i+1)*0.15*(i%2===0?1:-1);
    g.userData.axis = ['x','y','z'][i];
    orb.add(g); gimbals.push(g);
  });

  for (let i=0;i<c.sats;i++){
    const s = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.05, 0),
      new THREE.MeshBasicMaterial({ color: i%2===0?C.cy:C.am, transparent: 1, opacity: .9 })
    );
    s.userData = { a: Math.random()*Math.PI*2, inc: (Math.random()-.5)*Math.PI, rad: 2.7+Math.random()*0.6, spd: 0.3+Math.random()*0.5 };
    orb.add(s); sats.push(s);
  }

  const ac = [
    { r:2.75, tube:.014, col:C.cl, axis:'x', speed:.5 },
    { r:2.85, tube:.012, col:C.am, axis:'y', speed:-.6 },
    { r:2.65, tube:.010, col:C.te, axis:'z', speed:.7 },
    { r:3.0,  tube:.008, col:C.cy, axis:'x', speed:-.4 },
    { r:2.9,  tube:.010, col:C.am, axis:'y', speed:.45 }
  ].slice(0, c.ac);
  ac.forEach(cfg => {
    const arc = new THREE.Mesh(
      new THREE.TorusGeometry(cfg.r, cfg.tube, 5, 48, Math.PI*1.4),
      new THREE.MeshBasicMaterial({ color: cfg.col, transparent: 1, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: 0 })
    );
    arc.userData = { axis: cfg.axis, speed: cfg.speed };
    arc.rotation.x = Math.random()*Math.PI*2;
    arc.rotation.y = Math.random()*Math.PI*2;
    arc.rotation.z = Math.random()*Math.PI*2;
    orb.add(arc); arcBeams.push(arc);
  });

  particles = mkPts(c.pc, () => 1.6 + Math.random()*0.7, [C.cy, C.cl, C.am, C.wh], .09, 1, .05, .15);
  orb.add(particles);

  swarmPts = mkPts(c.dc, () => 2.3 + Math.random()*1.4, [C.cy, C.cl, C.te, C.pu], .07, .9, .18, .35);

const tasks = [], MAXT = 6;
const CCOL = { pending:['#ff9900','rgba(255,153,0,.18)'], working:['#00aaff','rgba(0,170,255,.22)'], done:['#00ffaa','rgba(0,255,170,.18)'], failed:['#ff2244','rgba(255,34,68,.22)'], auto:['#aa55ff','rgba(170,85,255,.18)'] };
function chipTex(text, state){
  const c=document.createElement('canvas'); c.width=512; c.height=128;
  const g=c.getContext('2d');
  const [fg,bg] = CCOL[state] || CCOL.pending;
  g.fillStyle=bg; g.fillRect(0,0,512,128);
  g.strokeStyle=fg; g.lineWidth=3; g.strokeRect(2,2,508,124);
  g.font='bold 24px monospace'; g.fillStyle=fg; g.textBaseline='middle';
  const words=String(text).split(' '); let line=''; const lines=[];
  for (const w of words){ const t=line?line+' '+w:w; if (g.measureText(t).width>470){ lines.push(line); line=w; } else line=t; }
  if (line) lines.push(line);
  lines.slice(0,3).forEach((l,i)=>g.fillText(l,20,44+i*32));
  g.font='bold 14px monospace'; g.fillText(String(state).toUpperCase(), 20, 110);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function spawn(text, isAuto){
  if (tasks.length>=MAXT){
    let i=0; while(i<tasks.length && tasks[i]===carried) i++;
    if (i>=tasks.length) i=0;
    const o=tasks.splice(i,1)[0];
    scene.remove(o.sprite);
    try{ o.sprite.material.map?.dispose(); o.sprite.material.dispose(); }catch{}
  }
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: 1, opacity: .95, depthWrite: 0 }));
  s.scale.set(1.5, .375, 1);
  const st = isAuto ? 'auto' : 'pending';
  const t = { sprite: s, text, state: st,
              ba: Math.random()*Math.PI*2, br: 3.2 + Math.random()*.9,
              bh: (Math.random()-.5)*2.4, ph: Math.random()*Math.PI*2, isAuto, flight: null };
  s.material.map = chipTex(text, st); s.material.needsUpdate = 1;
  scene.add(s); tasks.push(t); return t;
}
function setTS(t, state){
  if (t.state === state) return;
  t.state = state;
  try { t.sprite.material.map?.dispose(); } catch {}
  t.sprite.material.map = chipTex(t.text, state);
  t.sprite.material.needsUpdate = 1;
}

function analyze(h){
  const w = h[0];
  const ext = [d2(h[4],w) > d2(h[2],w)*1.12];
  for (const [t,p] of [[8,6],[12,10],[16,14],[20,18]]) ext.push(d2(h[t],w) > d2(h[p],w)*1.15);
  return { open: ext.filter(Boolean).length, size: d2(h[0],h[9])+d2(h[5],h[17]),
           palm: { x:(h[0].x+h[5].x+h[9].x+h[13].x+h[17].x)/5, y:(h[0].y+h[5].y+h[9].y+h[13].y+h[17].y)/5 } };
}
const pv = new THREE.Vector3();
const scrPos = o => { pv.copy(o).project(cam); return { x:pv.x+.5, y:.5-pv.y }; };

function doHands(r){
  const hands = r.landmarks || [];
  const now = performance.now();

  if (!hands.length){
    if (wasHand){
      rYV *= 2.2; rXV *= 2.2;
      wasHand = 0;
    }
    handOn = 0; pPalm = null; pSize = null;
    if (gMode === 'carrying' && carried) drop(carried, 0);
    gMode = 'idle'; carried = null; hovered = null; hStart = 0;
    hud.textContent = 'MODE: IDLE';
    return;
  }

  wasHand = 1; handOn = 1;
  const info = analyze(hands[0]);
  const g = info.open >= 4 ? 'open' : info.open <= 1 ? 'fist' : 'part';
  const hs = { x: 1 - info.palm.x, y: info.palm.y };

  if (gMode === 'carrying' && carried){
    const v = new THREE.Vector3((1-info.palm.x)*2-1, 1-info.palm.y*2, .5).unproject(cam);
    const d = v.sub(cam.position).normalize();
    carried.sprite.position.copy(cam.position.clone().add(d.multiplyScalar(3.2)));
    carried.sprite.scale.set(1.7, .425, 1);
    hud.textContent = 'CARRYING · palm over portal';
    if (info.open >= 4){
      const ps = scrPos(portal.position);
      if (Math.hypot(hs.x - ps.x, hs.y - ps.y) < .3){
        drop(carried, 1); carried = null; gMode = 'idle'; hovered = null; hStart = 0;
      }
    }
    return;
  }

  if (g === 'fist' && tasks.length){
    let cl2 = null, cd = .22;
    for (const t of tasks){
      if (t === carried) continue;
      const sp = scrPos(t.sprite.position);
      const d = Math.hypot(hs.x - sp.x, hs.y - sp.y);
      if (d < cd){ cl2 = t; cd = d; }
    }
    if (cl2){
      if (hovered !== cl2){ hovered = cl2; hStart = now; }
      cl2.sprite.scale.set(1.7, .425, 1);
      const pct = Math.min(100, Math.round((now - hStart) / DWELL * 100));
      hud.textContent = 'GRAB ' + pct + '%';
      if (now - hStart >= DWELL){ carried = cl2; gMode = 'carrying'; hud.textContent = 'CARRYING · palm over portal'; }
      const p = { x: 1-info.palm.x, y: info.palm.y };
      if (pPalm){
        const dx = p.x - pPalm.x, dy = p.y - pPalm.y;
        rotY += dx * 3.5; rotX += dy * 2.5;
        rYV = dx * 12; rXV = dy * 10;
      }
      pPalm = p; pSize = null; return;
    }
    hovered = null; hStart = 0;
    const p = { x: 1-info.palm.x, y: info.palm.y };
    if (pPalm){
      const dx = p.x - pPalm.x, dy = p.y - pPalm.y;
      rotY += dx * 6; rotX += dy * 5;
      rYV = dx * 20; rXV = dy * 16;
    }
    pPalm = p; pSize = null;
    hud.textContent = 'FIST · spin';
    return;
  }

  if (g === 'open'){
    hovered = null; hStart = 0;
    const p = { x: 1-info.palm.x, y: 1-info.palm.y };
    if (pPalm){
      const dx = p.x - pPalm.x, dy = p.y - pPalm.y;
      rotY += dx * 5; rotX += dy * 4;
      rYV = dx * 16; rXV = dy * 14;
    }
    pPalm = p;
    if (pSize){
      const dd = info.size - pSize;
      if (Math.abs(dd) > .008) zoom = cl(zoom - dd*25, 2, 12);
    }
    pSize = info.size;
    hud.textContent = 'OPEN · rotate';
    return;
  }

  hovered = null; hStart = 0; pPalm = null; pSize = null;
}
function drop(t, into){
  if (!t) return;

    t.flight = { from: t.sprite.position.clone(), t: 0, dur: .55 };

async function callLLM(msgs, max=220){
  const tries = wMod ? [wMod] : MODS;
  let lastErr = null;
  for (const m of tries){
    const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 30000);
    try {
      const r = await fetch(EP, { method:'POST',
        headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + KEY },
        body: JSON.stringify({ model: m, messages: msgs, temperature: .7, max_tokens: max }),
        signal: ac.signal });
      clearTimeout(to);
      if (r.status === 401 || r.status === 403) throw new Error('AUTH');
      if (!r.ok){ const b = await r.text(); console.error(`LLM7 "${m}":`, r.status, b); lastErr = new Error(`HTTP ${r.status} [${m}]`); wMod = null; continue; }
      const d = await r.json();
      const t = d.choices?.[0]?.message?.content?.trim();
      if (!t){ lastErr = new Error('Empty'); wMod = null; continue; }
      if (wMod !== m){ wMod = m; console.log('LLM7 model:', m); }
      return t;
    } catch(e){ clearTimeout(to); if (e.message === 'AUTH') throw e; lastErr = e; break; }
  }
  throw lastErr || new Error('All failed');
}

const clk = new THREE.Clock();
let fr = 0, fpsT = 0, tAcc = 0;
const camR = new THREE.Vector3(), camU = new THREE.Vector3(), camF = new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  try {
    const dt = clk.getDelta(), b = 1 + boost * 3;
    tAcc += dt * b; uT.value = tAcc; uB.value = boost;

    const dRot = Math.abs(rotY - lastRotY) + Math.abs(rotX - lastRotX);
    rotVel = rotVel * 0.88 + dRot * 0.12;
    uVel.value = Math.min(rotVel * 20, 1.2);
    lastRotY = rotY; lastRotX = rotX;

    if (autoOn && !busy && KEY){
      autoT -= dt * 1000;
      if (autoT <= 0){ autoT = 22000 + Math.random()*28000; autoThink(); }
    }

    if (!handOn){
      if (Math.abs(rYV) > .0005 || Math.abs(rXV) > .0005){
        rotY += rYV; rotX += rXV;
        rYV *= .97; rXV *= .97;
      } else {
        rotY += .002 * b; rotX += .0003 * b;
      }
    }
    if (rotX > Math.PI) rotX -= Math.PI*2;
    if (rotX < -Math.PI) rotX += Math.PI*2;

    orb.rotation.x += (rotX - orb.rotation.x) * .18;
    orb.rotation.y += (rotY - orb.rotation.y) * .18;
    cam.position.z += (zoom - cam.position.z) * .09;
    cam.lookAt(0,0,0);

    swarm.rotation.x += (orb.rotation.x - swarm.rotation.x) * .04;
    swarm.rotation.y += (orb.rotation.y - swarm.rotation.y) * .04;
    codeGroup.rotation.x += (orb.rotation.x - codeGroup.rotation.x) * .07;
    codeGroup.rotation.y += (orb.rotation.y - codeGroup.rotation.y) * .07;

    coreGlow.scale.setScalar(1 + Math.sin(tAcc * 2.5) * .1 + boost * .3);

    gimbals.forEach(g => { g.rotation[g.userData.axis] += dt * g.userData.spd * b; });

    mechanical.forEach(m => {
      if (m.userData.ph !== undefined){
        m.scale.setScalar(1 + Math.sin(tAcc * 1.5 + m.userData.ph) * 0.15);
      }
    });

    sats.forEach(s => {
      const u = s.userData;
      u.a += dt * u.spd * b;
      s.position.set(
        Math.cos(u.a) * u.rad,
        Math.sin(u.a * 1.3) * u.rad * Math.sin(u.inc),
        Math.sin(u.a) * u.rad
      );
      s.rotation.x += dt * 2 * b;
      s.rotation.y += dt * 1.5 * b;
    });

    arcBeams.forEach(a => { a.rotation[a.userData.axis] += dt * a.userData.speed * b; });

    codeSprites.forEach(s => {
      const u = s.userData;
      u.ph += dt * u.spd * b;
      s.position.copy(u.bp);
      s.position.y += Math.sin(u.ph) * .15;
      s.material.opacity = .5 + .45 * Math.sin(u.ph * 1.6);
    });

    cam.updateMatrixWorld();
    camR.setFromMatrixColumn(cam.matrixWorld, 0);
    camU.setFromMatrixColumn(cam.matrixWorld, 1);
    camF.set(-cam.matrixWorld.elements[8], -cam.matrixWorld.elements[9], -cam.matrixWorld.elements[10]).normalize();
    const pp = cam.position.clone()
      .add(camF.clone().multiplyScalar(3.5))
      .add(camR.clone().multiplyScalar(1.5))
      .add(camU.clone().multiplyScalar(-1.0));
    portal.position.copy(pp);
    portal.lookAt(cam.position);

    const pf = portal.userData.flash;
    portal.userData.flash = Math.max(0, pf - dt*2);

    P.outer.rotation.z += dt * .3 * b;
    P.mid.rotation.z   -= dt * .7 * b;
    P.inner.rotation.z += dt * 1.1 * b;
    P.halo.rotation.z  += dt * 1.8 * b;
    P.cageF.rotation.z += dt * .15 * b;
    P.cageB.rotation.z -= dt * .15 * b;
    P.sats.forEach(s => {
      const u = s.userData;
      const a = u.a + tAcc * u.spd;
      s.position.set(Math.cos(a)*u.rad, Math.sin(a)*u.rad, u.z);
      s.rotation.x += dt * 2.5 * b;
      s.rotation.z += dt * 2 * b;
    });
    P.struts.forEach((s,i) => { s.rotation.z = (i/4)*Math.PI + tAcc * .18 * b; });
    P.marker.position.y = 1.55 + Math.sin(tAcc * 1.4) * .08;
    P.marker.rotation.z = tAcc * 1.2;
    P.marker.rotation.x = tAcc * .8;
    P.halo.material.opacity = Math.min(1, .35 + .12 * Math.sin(tAcc * 3) + pf * .7);
    P.tube.material.opacity = Math.min(1, .2 + pf * .7);
    P.mid.material.opacity = Math.min(1, .75 + pf * .3);
    P.hole.scale.setScalar(1 + pf * .35);
    P.corona.material.opacity = .08 + pf * .25;

    for (let i = tasks.length-1; i >= 0; i--){
      const t = tasks[i];
      if (t === carried) continue;
      if (t.flight){
        t.flight.t += dt / t.flight.dur;
        if (t.flight.t >= 1){
          scene.remove(t.sprite);
          try { t.sprite.material.map?.dispose(); t.sprite.material.dispose(); } catch {}
          tasks.splice(i,1); continue;
        }
        const e = 1 - Math.pow(1 - t.flight.t, 2);
        t.sprite.position.lerpVectors(t.flight.from, portal.position, e);
        t.sprite.material.opacity = 1 - t.flight.t;
        t.sprite.scale.setScalar(1.5 * (1 - t.flight.t * .9));
        continue;
      }
      const a = t.ba + tAcc * .15;
      t.sprite.position.set(Math.cos(a)*t.br, t.bh + Math.sin(tAcc + t.ph)*.15, Math.sin(a)*t.br);
      if (t !== hovered) t.sprite.scale.set(1.5, .375, 1);
    }

    comp.render();
    fr++; fpsT += dt;
    if (fpsT >= 1){ fpsEl.textContent = 'FPS: ' + fr; fr = 0; fpsT = 0; }
  } catch(e){ console.error('Frame:', e); }
}

try { buildOrb('performance'); ldr.classList.add('hidden'); }
catch (e){ console.error('Init:', e); ldr.textContent = 'INIT FAILED: ' + e.message; errBox('Init failed:\n' + e.message + '\n\n' + (e.stack||'')); }
loop();

addEventListener('resize', () => {
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  ren.setSize(innerWidth,innerHeight); comp.setSize(innerWidth,innerHeight);
  if (Q[quality].bl) bloom.setSize(innerWidth*.5, innerHeight*.5);
});
addEventListener('beforeunload', () => {
  try { speechSynthesis.cancel(); } catch {}
  try { sr?.stop(); } catch {}
});
</script>
</body>
</html>
