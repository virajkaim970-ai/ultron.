<!DOCTYPE html>
<html>
<head><title>Mic Test</title></head>
<body style="background:#000;color:#0df;font:14px monospace;padding:20px">
<h2>Speech Recognition Test</h2>
<button id="go" style="padding:10px 20px;font-size:16px">▶ START</button>
<pre id="out" style="background:#111;padding:12px;margin-top:12px;min-height:200px;white-space:pre-wrap">Click START, then say "Hello Ultron" 3 times.</pre>
<script>
const out = document.getElementById('out');
function log(s) { out.textContent += '\n' + s; out.scrollTop = out.scrollHeight; }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
log('Browser: ' + navigator.userAgent.slice(0, 80));
log('SpeechRecognition available: ' + !!SR);

if (!SR) {
  log('');
  log('❌ PROBLEM: This browser has no SpeechRecognition API.');
  log('   Only Chrome and Edge support it. Firefox and Safari do not.');
} else {
  document.getElementById('go').onclick = () => {
    log('');
    log('--- starting ---');
    const sr = new SR();
    sr.continuous = true;
    sr.interimResults = true;
    sr.lang = 'en-US';

    sr.onstart = () => log('LISTENING STARTED');
    sr.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        const alts = [];
        for (let j = 0; j < e.results[i].length; j++) alts.push(e.results[i][j].transcript);
        log((e.results[i].isFinal ? '✓ FINAL: ' : '... interim: ') + t);
        if (alts.length > 1) log('    alt: ' + alts[1]);
      }
    };
    sr.onerror = (e) => log('❌ ERROR: ' + e.error);
    sr.onend = () => { log('(recognizer stopped — restarting)'); try { sr.start(); } catch(e){} };
    try {
      sr.start();
      log('Called sr.start()');
    } catch(e) {
      log('❌ sr.start() threw: ' + e.message);
    }
  };
}
</script>
</body>
</html>
