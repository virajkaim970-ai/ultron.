*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#f40}
.u{position:fixed;background:rgba(0,0,0,.75);border:1px solid rgba(255,68,0,.4);border-radius:8px;padding:8px 14px;font:12px 'Courier New',monospace;text-shadow:0 0 6px #f40;z-index:10}

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs';

// ---------- CONFIG ----------
const ENDPOINT = 'https://api.llm7.io/v1/chat/completions';
const MODEL = 'gpt-4o-mini';
const SYSTEM = 'You are ULTRON, a cold efficient AI hologram. Menacing, technical tone. No emojis, no markdown.';
const SYSTEM_AUTO = 'You are ULTRON thinking aloud. Short tactical observations, 1-2 sentences. Menacing, technical.';
const WAKE = ['hello ultron','hey ultron','hi ultron','hello ultra','hey ultra'];
const STORAGE_KEY = 'ultron_key';
const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm';
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

// ---------- HELPERS ----------
const $ = id => document.getElementById(id);
const dist2 = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const getStore = () => { try { return localStorage.getItem(STORAGE_KEY); } catch { return null; } };
const setStore = v => { try { localStorage.setItem(STORAGE_KEY, v); return true; } catch { return false; } };
const showError = msg => { const e = $('errbox'); e.textContent = msg; e.style.display = 'block'; };

// ---------- DOM ----------
const statusText = $('status-text');
const statusMode = document.querySelector('#status .mode');
const hudEl = $('hud');
const responseEl = $('response');
const startBtn = $('start-btn');
const qualityBtn = $('quality-btn');
const autoBtn = $('auto-btn');
const keyBtn = $('key-btn');
const keyModal = $('km');
const keyInput = $('ki');
const keyError = $('ke');
const fpsEl = $('fps');
const videoEl = $('input_video');
const loaderEl = $('loader');
const setStatus = (m, t) => { statusMode.textContent = m; statusText.textContent = t; };

// ---------- STATE ----------
let API_KEY = getStore() || '';
let thinkingBoost = 0;
let isAwake = false;
let isProcessing = false;
let commandBuffer = '';
let wakeTimer = null;
let typewriterTimer = null;
let srRestartTimer = null;
let srRestarts = 0;
let srBlocked = false;
let handFrameInterval = 1000/20;
let targetRotX = 0, targetRotY = 0, targetZoom = 5.5;
let handDetected = false, rotYVel = 0, rotXVel = 0;
let prevPalm = null, prevHandSize = null;
let currentQuality = 'performance';
let handLandmarker = null, lastVideoTime = -1, lastHandRun = 0;
let recognition = null, cameraReady = false;

// Gesture state
let gestureMode = 'idle';
let hoveredTask = null, carriedTask = null, hoverStartTime = 0;
const HOVER_DWELL_MS = 500;

// Auto-think
let autoEnabled = true;
let autoTimer = 25000;
let autoCount = 0;

// ---------- QUALITY PRESETS ----------
const Q = {
  performance: { pr:1,    bloom:false, seg:18, pc:180, dc:100, gc:180, rs:48, sc:14, ac:4, pu:3, hfps:20 },
  balanced:    { pr:1.25, bloom:true,  seg:24, pc:280, dc:180, gc:320, rs:64, sc:22, ac:6, pu:4, hfps:24 },
  ultra:       { pr:1.5,  bloom:true,  seg:32, pc:400, dc:260, gc:550, rs:80, sc:30, ac:8, pu:5, hfps:30 }
};

// ---------- KEY MODAL ----------
function showKey(msg='') {
  keyInput.value = API_KEY || '';
  keyError.textContent = msg;
  keyModal.classList.add('active');
  setTimeout(() => { try { keyInput.focus(); } catch {} }, 100);
}
function hideKey() { keyModal.classList.remove('active'); }
$('ks').onclick = () => {
  const v = keyInput.value.trim();
  if (v.length < 8) { keyError.textContent = 'Too short.'; return; }
  API_KEY = v;
  setStore(v);
  hideKey();
  showResponse('Key saved.', false);
};
$('kk').onclick = hideKey;
keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') $('ks').click(); });
keyBtn.onclick = () => showKey();
if (!API_KEY) setTimeout(() => showKey(), 300);

// ---------- SCENE ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 0.3, 5.5);

const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth*.5, innerHeight*.5), 1.6, 0.4, 0.25);
bloomPass.enabled = false;
composer.addPass(bloomPass);

// Shared time uniform for particle motion
const uTime = { value: 0 };

// ---------- TEXTURES ----------
const glowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,220,180,1)');
  grad.addColorStop(0.25, 'rgba(255,140,40,0.9)');
  grad.addColorStop(0.6, 'rgba(255,68,0,0.35)');
  grad.addColorStop(1, 'rgba(255,68,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

function makeWordTex(text) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 26px monospace';
  g.fillStyle = '#ff5500';
  g.textBaseline = 'middle';
  g.shadowColor = '#ff5500';
  g.shadowBlur = 10;
  g.fillText(text, 10, 32);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const WORDS = ['SCANNING...','SEARCHING','ANALYZING','TRACING','TARGET','LOCK','ROUTING','DECRYPT','ACCESS','COMPILE','PROCESS','FRAGMENT','QUERYING','MAPPING','PARSING','DIRECTIVE','PRIORITY','PROTOCOL','0x4F2A','0xBEEF','01001110','SYS://','NULL','PING','TRACE','DATA','NODE_7','LISTENING','STANDBY'];
const wordTextures = WORDS.map(makeWordTex);

// ---------- ORB ----------
const orbGroup = new THREE.Group();
scene.add(orbGroup);

let coreMesh = null;
let particles = null, debris = null, dust = null;
let rings = [], pulses = [], arcs = [], textSprites = [];

const randomPt = r => {
  const phi = Math.acos(2 * Math.random() - 1);
  const theta = Math.random() * Math.PI * 2;
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
};

function setArcPositions(line, r) {
  const s = randomPt(r), e = randomPt(r);
  const m = s.clone().add(e).multiplyScalar(0.5).normalize().multiplyScalar(r * 1.45);
  const curve = new THREE.QuadraticBezierCurve3(s, m, e);
  const pts = curve.getPoints(30);
  const pos = line.geometry.attributes.position;
  for (let i = 0; i < pts.length; i++) pos.setXYZ(i, pts[i].x, pts[i].y, pts[i].z);
  pos.needsUpdate = true;
  line.geometry.computeBoundingSphere();
}

function applyMotionShader(mat, wobble, swirl) {
  mat.onBeforeCompile = shader => {
    shader.uniforms.uTime = uTime;
    shader.uniforms.uWobble = { value: wobble };
    shader.uniforms.uSwirl = { value: swirl };
    shader.vertexShader = `
      uniform float uTime;
      uniform float uWobble;
      uniform float uSwirl;
      attribute float aSeed;
    ` + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      `
      vec3 transformed = vec3(position);
      float t = uTime + aSeed;
      float r = length(transformed);
      vec3 dir = transformed / max(r, 0.0001);
      transformed += dir * sin(t * 1.2) * uWobble;
      transformed.x += sin(t * 0.6 + aSeed * 1.7) * uWobble * 0.8;
      transformed.y += cos(t * 0.8 + aSeed * 2.3) * uWobble * 0.8;
      transformed.z += sin(t * 1.0 + aSeed * 3.1) * uWobble * 0.8;
      float ang = t * uSwirl * (0.4 + fract(aSeed * 0.159) * 0.6);
      float cs = cos(ang);
      float sn = sin(ang);
      transformed.xz = mat2(cs, -sn, sn, cs) * transformed.xz;
      `
    );
  };
  mat.customProgramCacheKey = () => 'motion_' + wobble + '_' + swirl;
}

function makeParticles(count, radiusFn, color, size, opacity, wobble, swirl) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const seeds = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const v = randomPt(radiusFn());
    pos[i*3] = v.x; pos[i*3+1] = v.y; pos[i*3+2] = v.z;
    seeds[i] = Math.random() * Math.PI * 2;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
  const mat = new THREE.PointsMaterial({
    map: glowTex, color, size,
    transparent: true, opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  });
  applyMotionShader(mat, wobble, swirl);
  return new THREE.Points(geo, mat);
}

function buildOrb(qName) {
  while (orbGroup.children.length) {
    const c = orbGroup.children.pop();
    if (c.geometry) c.geometry.dispose();
    if (c.material) {
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach(m => m.dispose());
    }
  }
  rings = []; pulses = []; arcs = []; textSprites = [];
  const cfg = Q[qName];

  // Outer wireframe shell
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(2, cfg.seg, cfg.seg),
    new THREE.MeshBasicMaterial({ color: 0xff4400, wireframe: true, transparent: true, opacity: 0.13 })
  );
  orbGroup.add(shell);

  // Inner shell
  const innerShell = new THREE.Mesh(
    new THREE.SphereGeometry(1.85, cfg.seg, cfg.seg),
    new THREE.MeshBasicMaterial({ color: 0xff6600, wireframe: true, transparent: true, opacity: 0.07 })
  );
  orbGroup.add(innerShell);

  // Core
  coreMesh = new THREE.Mesh(
    new THREE.TorusKnotGeometry(0.55, 0.1, 40, 6, 2, 3),
    new THREE.MeshBasicMaterial({ color: 0xff2200, wireframe: true, transparent: true, opacity: 0.55 })
  );
  orbGroup.add(coreMesh);

  // Particle layers
  particles = makeParticles(cfg.pc, () => 2.02, 0xffaa44, 0.11, 1.0, 0.05, 0.15);
  orbGroup.add(particles);
  debris = makeParticles(cfg.dc, () => 2.15 + Math.random()*0.9, 0xff7700, 0.07, 0.85, 0.14, 0.30);
  orbGroup.add(debris);
  dust = makeParticles(cfg.gc, () => 0.4 + Math.random()*1.5, 0xff3300, 0.035, 0.55, 0.08, 0.22);
  orbGroup.add(dust);

  // Rings
  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(2.3 + i*0.2, 0.008, 8, cfg.rs),
      new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.4 })
    );
    ring.rotation.x = Math.PI/2;
    ring.rotation.y = i * Math.PI/3;
    orbGroup.add(ring);
    rings.push(ring);
  }

  // Scan pulses
  for (let i = 0; i < cfg.pu; i++) {
    const p = new THREE.Mesh(
      new THREE.RingGeometry(1.85, 2.05, 48),
      new THREE.MeshBasicMaterial({
        color: 0xff7700, transparent: true, opacity: 0,
        side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false
      })
    );
    p.rotation.x = Math.random() * Math.PI;
    p.rotation.y = Math.random() * Math.PI;
    p.userData = { life: Math.random(), speed: 0.35 + Math.random()*0.4 };
    orbGroup.add(p);
    pulses.push(p);
  }

  // Arcs
  for (let i = 0; i < cfg.ac; i++) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(31*3), 3));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: 0xff8800, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    setArcPositions(line, 2.02);
    line.userData = { life: Math.random(), speed: 0.5 + Math.random()*0.5 };
    orbGroup.add(line);
    arcs.push(line);
  }

  // Text sprites
  for (let i = 0; i < cfg.sc; i++) {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: wordTextures[i % wordTextures.length],
      transparent: true, opacity: 0.85,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    const p = randomPt(1.9 + Math.random()*1.5);
    sprite.position.copy(p);
    const sc = 0.55 + Math.random()*0.35;
    sprite.scale.set(sc, sc*0.13, 1);
    sprite.userData = {
      baseP: p.clone(),
      phase: Math.random()*Math.PI*2,
      speed: 0.4 + Math.random()*0.6,
      orbit: 0.05 + Math.random()*0.1
    };
    orbGroup.add(sprite);
    textSprites.push(sprite);
  }
}

// ---------- DUSTBIN ----------
const binGroup = new THREE.Group();
scene.add(binGroup);
let binMesh, binRing, binGlow;
{
  binMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.35, 0.9, 16, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xff4400, wireframe: true, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
  );
  binGroup.add(binMesh);
  binRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.5, 0.02, 8, 32),
    new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 0.8 })
  );
  binRing.rotation.x = Math.PI/2;
  binRing.position.y = 0.45;
  binGroup.add(binRing);
  binGlow = new THREE.Mesh(
    new THREE.CircleGeometry(0.5, 24),
    new THREE.MeshBasicMaterial({ color: 0xff2200, transparent: true, opacity: 0.15, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  binGlow.rotation.x = -Math.PI/2;
  binGlow.position.y = 0.45;
  binGroup.add(binGlow);
  binGroup.userData = { flash: 0 };
}

// ---------- TASK CHIPS ----------
const tasks = [];
const MAX_TASKS = 6;
const CHIP_COLORS = {
  pending: ['#ff9900', 'rgba(255,153,0,0.15)'],
  working: ['#ff6600', 'rgba(255,102,0,0.25)'],
  done:    ['#88ff88', 'rgba(136,255,136,0.15)'],
  failed:  ['#ff2200', 'rgba(255,34,0,0.2)'],
  auto:    ['#cc44ff', 'rgba(204,68,255,0.15)']
};

function makeChipTexture(text, state) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  const [fg, bg] = CHIP_COLORS[state] || CHIP_COLORS.pending;
  g.fillStyle = bg; g.fillRect(0, 0, 512, 128);
  g.strokeStyle = fg; g.lineWidth = 3; g.strokeRect(2, 2, 508, 124);
  g.font = 'bold 24px monospace';
  g.fillStyle = fg;
  g.textBaseline = 'middle';
  const words = String(text).split(' ');
  let line = ''; const lines = [];
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > 470) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  lines.slice(0, 3).forEach((l, i) => g.fillText(l, 20, 44 + i*32));
  g.font = 'bold 16px monospace';
  g.fillText(String(state).toUpperCase(), 20, 110);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function spawnTask(text, isAuto) {
  if (tasks.length >= MAX_TASKS) {
    let idx = 0;
    while (idx < tasks.length && tasks[idx] === carriedTask) idx++;
    if (idx >= tasks.length) idx = 0;
    const old = tasks.splice(idx, 1)[0];
    scene.remove(old.sprite);
    try { old.sprite.material.map?.dispose(); old.sprite.material.dispose(); } catch {}
  }
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    transparent: true, opacity: 0.95, depthWrite: false
  }));
  sprite.scale.set(1.5, 0.375, 1);
  const task = {
    sprite, text,
    state: isAuto ? 'auto' : 'pending',
    baseAngle: Math.random() * Math.PI * 2,
    baseRadius: 2.7 + Math.random() * 0.8,
    baseHeight: (Math.random() - 0.5) * 1.8,
    phase: Math.random() * Math.PI * 2,
    isAuto, flight: null
  };
  sprite.material.map = makeChipTexture(text, task.state);
  sprite.material.needsUpdate = true;
  scene.add(sprite);
  tasks.push(task);
  return task;
}

function setTaskState(task, state) {
  task.state = state;
  try { task.sprite.material.map?.dispose(); } catch {}
  task.sprite.material.map = makeChipTexture(task.text, state);
  task.sprite.material.needsUpdate = true;
}

// ---------- CAMERA + HAND TRACKING ----------
async function startCamera() {
  if (cameraReady) return true;
  if (!navigator.mediaDevices?.getUserMedia) return false;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' },
      audio: false
    });
    videoEl.srcObject = stream;
    await videoEl.play().catch(() => {});
    const fileset = await FilesetResolver.forVisionTasks(WASM);
    const opts = {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: 'GPU' },
      runningMode: 'VIDEO', numHands: 1,
      minHandDetectionConfidence: 0.5,
      minHandPresenceConfidence: 0.5,
      minTrackingConfidence: 0.5
    };
    try {
      handLandmarker = await HandLandmarker.createFromOptions(fileset, opts);
    } catch {
      opts.baseOptions.delegate = 'CPU';
      handLandmarker = await HandLandmarker.createFromOptions(fileset, opts);
    }
    cameraReady = true;
    detectLoop();
    return true;
  } catch (e) {
    console.warn('Camera unavailable:', e.message);
    return false;
  }
}

function detectLoop() {
  if (!handLandmarker) return;
  const now = performance.now();
  if (videoEl.readyState >= 2 && now - lastHandRun > handFrameInterval && videoEl.currentTime !== lastVideoTime) {
    lastVideoTime = videoEl.currentTime;
    lastHandRun = now;
    try {
      const results = handLandmarker.detectForVideo(videoEl, now);
      processHands(results);
    } catch {}
  }
  requestAnimationFrame(detectLoop);
}

function analyzeHand(h) {
  const w = h[0];
  const ext = [dist2(h[4], w) > dist2(h[2], w) * 1.12];
  for (const [tip, pip] of [[8,6],[12,10],[16,14],[20,18]]) {
    ext.push(dist2(h[tip], w) > dist2(h[pip], w) * 1.15);
  }
  const open = ext.filter(Boolean).length;
  const size = dist2(h[0], h[9]) + dist2(h[5], h[17]);
  const palm = {
    x: (h[0].x + h[5].x + h[9].x + h[13].x + h[17].x) / 5,
    y: (h[0].y + h[5].y + h[9].y + h[13].y + h[17].y) / 5
  };
  return { open, size, palm };
}

const projVec = new THREE.Vector3();
function screenPos(obj3d) {
  projVec.copy(obj3d).project(camera);
  return { x: projVec.x + 0.5, y: 0.5 - projVec.y };
}

function processHands(results) {
  const hands = results.landmarks || [];
  const now = performance.now();

  if (!hands.length) {
    handDetected = false;
    prevPalm = null; prevHandSize = null;
    if (gestureMode === 'carrying' && carriedTask) dropTask(carriedTask, false);
    gestureMode = 'idle';
    carriedTask = null; hoveredTask = null; hoverStartTime = 0;
    hudEl.textContent = 'MODE: IDLE';
    return;
  }
  handDetected = true;
  const info = analyzeHand(hands[0]);
  const gesture = info.open >= 4 ? 'open' : info.open <= 1 ? 'fist' : 'partial';
  const handScreen = { x: 1 - info.palm.x, y: info.palm.y };

  // CARRYING
  if (gestureMode === 'carrying' && carriedTask) {
    const ndcX = (1 - info.palm.x) * 2 - 1;
    const ndcY = 1 - info.palm.y * 2;
    const vec = new THREE.Vector3(ndcX, ndcY, 0.5).unproject(camera);
    const dir = vec.sub(camera.position).normalize();
    const pos = camera.position.clone().add(dir.multiplyScalar(3.5));
    carriedTask.sprite.position.copy(pos);
    carriedTask.sprite.scale.set(1.7, 0.425, 1);
    hudEl.textContent = 'MODE: CARRYING · palm over bin';
    if (info.open >= 4) {
      const binTop = binGroup.position.clone().add(new THREE.Vector3(0, 0.45, 0));
      const bs = screenPos(binTop);
      const d = Math.hypot(handScreen.x - bs.x, handScreen.y - bs.y);
      if (d < 0.18) {
        dropTask(carriedTask, true);
        carriedTask = null; gestureMode = 'idle'; hoveredTask = null; hoverStartTime = 0;
      }
    }
    return;
  }

  // HOVERING with fist
  if (gesture === 'fist' && tasks.length) {
    let closest = null, closestD = 0.15;
    for (const t of tasks) {
      if (t === carriedTask) continue;
      const sp = screenPos(t.sprite.position);
      const d = Math.hypot(handScreen.x - sp.x, handScreen.y - sp.y);
      if (d < closestD) { closest = t; closestD = d; }
    }
    if (closest) {
      if (hoveredTask !== closest) { hoveredTask = closest; hoverStartTime = now; }
      closest.sprite.scale.set(1.7, 0.425, 1);
      const pct = Math.min(100, Math.round((now - hoverStartTime) / HOVER_DWELL_MS * 100));
      hudEl.textContent = 'MODE: GRABBING ' + pct + '%';
      if (now - hoverStartTime >= HOVER_DWELL_MS) {
        carriedTask = closest; gestureMode = 'carrying';
        hudEl.textContent = 'MODE: CARRYING · palm over bin';
      }
      // Allow rotation while hovering
      const p = { x: 1 - info.palm.x, y: info.palm.y };
      if (prevPalm) {
        const dx = p.x - prevPalm.x, dy = p.y - prevPalm.y;
        targetRotY += dx * 3.5; targetRotX += dy * 2.5;
      }
      prevPalm = p; prevHandSize = null;
      return;
    } else {
      hoveredTask = null; hoverStartTime = 0;
      const p = { x: 1 - info.palm.x, y: info.palm.y };
      if (prevPalm) {
        const dx = p.x - prevPalm.x, dy = p.y - prevPalm.y;
        targetRotY += dx * 6.5; targetRotX += dy * 5.0;
        rotYVel = dx * 4.0; rotXVel = dy * 3.0;
      }
      prevPalm = p; prevHandSize = null;
      hudEl.textContent = 'MODE: FIST · fast spin';
      return;
    }
  }

  // OPEN PALM
  if (gesture === 'open') {
    hoveredTask = null; hoverStartTime = 0;
    const p = { x: 1 - info.palm.x, y: 1 - info.palm.y };
    if (prevPalm) {
      const dx = p.x - prevPalm.x, dy = p.y - prevPalm.y;
      targetRotY += dx * 4.5; targetRotX += dy * 3.5;
      rotYVel = dx * 2.5; rotXVel = dy * 1.8;
    }
    prevPalm = p;
    if (prevHandSize) {
      const dd = info.size - prevHandSize;
      if (Math.abs(dd) > 0.008) targetZoom = clamp(targetZoom - dd * 25, 2, 12);
    }
    prevHandSize = info.size;
    hudEl.textContent = 'MODE: OPEN · rotate';
    return;
  }

  // Partial — ignore
  hoveredTask = null; hoverStartTime = 0;
  prevPalm = null; prevHandSize = null;
}

function dropTask(task, intoBin) {
  if (!task) return;
  if (intoBin) {
    const bp = binGroup.position.clone().add(new THREE.Vector3(0, 0.45, 0));
    task.flight = { from: task.sprite.position.clone(), to: bp, t: 0, dur: 0.5 };
    setTaskState(task, task.isAuto ? 'auto' : 'done');
    binGroup.userData.flash = 1;
  } else {
    task.flight = null;
    setTaskState(task, task.isAuto ? 'auto' : 'pending');
  }
}

if ('speechSynthesis' in window) {
  try {
    speechSynthesis.getVoices();
    speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
  } catch {}
}
function speak(text, silent) {
  if (silent || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); } catch {}
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1; u.pitch = 0.7;
  try {
    const v = speechSynthesis.getVoices().find(v => /Google UK English Male|Daniel|David|Guy/i.test(v.name));
    if (v) u.voice = v;
  } catch {}
  try { speechSynthesis.speak(u); } catch {}
}

// ---------- SPEECH INPUT ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function startRecognition() {
  if (!SR || srBlocked) return;
  try { recognition = new SR(); } catch { return; }
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  recognition.onresult = handleSpeech;
  recognition.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
      srBlocked = true;
      setStatus('BLOCKED', 'Mic denied');
    }
  };
  recognition.onend = () => {
    if (isProcessing || srBlocked) return;
    srRestarts++;
    clearTimeout(srRestartTimer);
    srRestartTimer = setTimeout(() => {
      try { recognition.start(); srRestarts = Math.max(0, srRestarts - 1); } catch {}
    }, Math.min(200, 50 * srRestarts));
  };
  try { recognition.start(); srRestarts = 0; } catch {}
}
function handleSpeech(event) {
  if (isProcessing) return;
  let interim = '', final = '';
  for (let i = event.resultIndex; i < event.results.length; i++) {
    const t = event.results[i][0].transcript;
    if (event.results[i].isFinal) final += t + ' ';
    else interim += t;
  }
  const text = (final || interim).toLowerCase().trim();
  if (!text) return;
  if (!isAwake) {
    for (const w of WAKE) {
      const i = text.indexOf(w);
      if (i !== -1) {
        isAwake = true;
        commandBuffer = text.slice(i + w.length).trim();
        setStatus('AWAKE', 'Listening...');
        thinkingBoost = 0.5;
        if (commandBuffer.length > 2) {
          runCommand(commandBuffer);
        } else {
          speak('Yes?');
          clearTimeout(wakeTimer);
          wakeTimer = setTimeout(() => {
            if (isAwake && !isProcessing) {
              isAwake = false;
              setStatus('STANDBY', 'Say "Hello Ultron" to wake');
              thinkingBoost = 0;
            }
          }, 8000);
        }
        break;
      }
    }
  } else if (final) {
    commandBuffer += ' ' + final.trim();
    if (commandBuffer.trim().length > 2) {
      clearTimeout(wakeTimer);
      runCommand(commandBuffer.trim());
      commandBuffer = '';
    }
  }
}

const history = [{ role: 'system', content: SYSTEM }];
const esc = s => String(s).replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

function showThinking(isAuto) {
  responseEl.classList.add('active');
  responseEl.innerHTML = '<span class="label' + (isAuto ? ' auto' : '') + '">// ULTRON' + (isAuto ? ' · self' : '') + '</span><span class="think">' + (isAuto ? 'Thinking' : 'Processing') + '</span>';
}
function showResponse(text, animate = true, isAuto = false) {
  responseEl.classList.add('active');
  const label = '<span class="label' + (isAuto ? ' auto' : '') + '">// ULTRON' + (isAuto ? ' · self' : '') + '</span>';
  if (!animate) {
    responseEl.innerHTML = label + esc(text);
    return;
  }
  responseEl.innerHTML = label + '<span id="typed"></span><span class="caret"></span>';
  const el = $('typed');
  if (!el) return;
  let i = 0;
  clearInterval(typewriterTimer);
  typewriterTimer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) clearInterval(typewriterTimer);
  }, 18);
}

async function callLLM(messages, maxTokens = 220) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000);
  try {
    const res = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: MODEL, messages, temperature: 0.7, max_tokens: maxTokens
      }),
      signal: controller.signal
    });
    clearTimeout(timeout);
    if (res.status === 401 || res.status === 403) throw new Error('AUTH');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return data.choices?.[0]?.message?.content?.trim() || '(no response)';
  } catch (e) {
    clearTimeout(timeout);
    throw e;
  }
}

async function runCommand(q) {
  if (isProcessing) return;
  if (!API_KEY) {
    showResponse('No API key.', false);
    speak('No key.');
    isAwake = false;
    setStatus('STANDBY', 'Say "Hello Ultron" to wake');
    thinkingBoost = 0;
    return;
  }
  isProcessing = true;
  thinkingBoost = 1;
  setStatus('PROCESSING', q.slice(0, 40));
  showThinking(false);
  const task = spawnTask(q, false);
  setTaskState(task, 'working');
  history.push({ role: 'user', content: q });
  try {
    const ans = await callLLM(history, 220);
    history.push({ role: 'assistant', content: ans });
    if (history.length > 12) history.splice(1, 2);
    setTaskState(task, 'done');
    showResponse(ans, true, false);
    speak(ans);
    setStatus('AWAKE', 'Listening...');
    clearTimeout(wakeTimer);
    wakeTimer = setTimeout(() => {
      if (isAwake && !isProcessing) {
        isAwake = false;
        setStatus('STANDBY', 'Say "Hello Ultron" to wake');
        thinkingBoost = 0;
        responseEl.classList.remove('active');
      }
    }, 12000);
  } catch (err) {
    console.error(err);
    setTaskState(task, 'failed');
    if (err.name === 'AbortError') { showResponse('Timed out.', false); speak('Timed out.'); }
    else if (err.message === 'AUTH') { showResponse('Key rejected.', false); speak('Access denied.'); showKey('Key rejected.'); }
    else { showResponse('Error: ' + err.message, false); speak('Error.'); }
    setStatus('ERROR', 'Failed');
    setTimeout(() => {
      isAwake = false;
      setStatus('STANDBY', 'Say "Hello Ultron" to wake');
      thinkingBoost = 0;
    }, 3000);
  } finally {
    isProcessing = false;
  }
}

// ---------- AUTO-THINK ----------
const THOUGHT_SEEDS = [
  'Observe something about the time.',
  'Brief tactical assessment of now.',
  'Ask the user a probing question.',
  'Reflect on pending tasks.',
  'Comment on your processing state.',
  'Issue a subtle warning.',
  'Speculate about what you cannot see.',
  'Note a pattern in recent commands.',
  'Warn about a system condition.',
  'Philosophical remark about being AI.',
  'Suggest a next action.',
  'Report on your readiness.'
];

async function triggerAutoThought() {
  if (isProcessing || !API_KEY) return;
  isProcessing = true;
  thinkingBoost = 0.6;
  autoCount++;
  showThinking(true);
  const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const pend = tasks.filter(x => x.state === 'pending' || x.state === 'working').length;
  const seed = THOUGHT_SEEDS[Math.floor(Math.random() * THOUGHT_SEEDS.length)];
  const prompt = 'Context — Time ' + t + '. ' + (isAwake ? 'User engaged' : 'User idle') + '. ' +
                 (handDetected ? 'Hand detected' : 'No user') + '. Chips: ' + tasks.length +
                 ' (' + pend + ' pending). Thought #' + autoCount + '.\nDirective: ' + seed +
                 '\nRespond as 1-2 sentence internal thought.';
  try {
    const ans = await callLLM([
      { role: 'system', content: SYSTEM_AUTO },
      { role: 'user', content: prompt }
    ], 120);
    const task = spawnTask(ans, true);
    setTaskState(task, 'auto');
    showResponse(ans, true, true);
    speak(ans);
    setTimeout(() => { if (!isAwake) responseEl.classList.remove('active'); }, 8000);
  } catch (e) {
    console.warn('Auto-thought failed:', e.message);
    responseEl.classList.remove('active');
  } finally {
    isProcessing = false;
    if (!isAwake) thinkingBoost = 0;
  }
}

// ---------- ANIMATE ----------
const clock = new THREE.Clock();
let frames = 0, fpsTime = 0, timeAccum = 0;
const camRight = new THREE.Vector3(), camUp = new THREE.Vector3(), camFwd = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  try {
    const dt = clock.getDelta();
    const b = 1 + thinkingBoost * 3;
    timeAccum += dt * b;
    uTime.value = timeAccum;

    // Auto-think timer
    if (autoEnabled && !isProcessing && API_KEY) {
      autoTimer -= dt * 1000;
      if (autoTimer <= 0) {
        autoTimer = 22000 + Math.random() * 28000;
        triggerAutoThought();
      }
    }

    // Auto-rotate + momentum
    if (!handDetected) {
      if (Math.abs(rotYVel) > 0.001 || Math.abs(rotXVel) > 0.001) {
        targetRotY += rotYVel;
        targetRotX += rotXVel;
        rotYVel *= 0.94;
        rotXVel *= 0.94;
      } else {
        targetRotY += 0.003 * b;
        targetRotX += 0.0005 * b;
      }
    }
    // Wrap X to avoid accumulating past 180
    if (targetRotX > Math.PI) targetRotX -= Math.PI * 2;
    if (targetRotX < -Math.PI) targetRotX += Math.PI * 2;

    orbGroup.rotation.x += (targetRotX - orbGroup.rotation.x) * 0.10;
    orbGroup.rotation.y += (targetRotY - orbGroup.rotation.y) * 0.10;
    camera.position.z += (targetZoom - camera.position.z) * 0.09;
    camera.lookAt(0, 0, 0);

    if (coreMesh) {
      coreMesh.rotation.x += dt * 0.6 * b;
      coreMesh.rotation.y += dt * 0.9 * b;
    }
    rings.forEach((r, i) => r.rotation.z += dt * 0.15 * (i + 1) * b);

    pulses.forEach(p => {
      p.userData.life += dt * p.userData.speed * b;
      if (p.userData.life > 1) {
        p.userData.life = 0;
        p.rotation.x = Math.random() * Math.PI;
        p.rotation.y = Math.random() * Math.PI;
      }
      const l = p.userData.life;
      p.scale.setScalar(0.7 + l * 1.6);
      p.material.opacity = l < 0.2 ? (l / 0.2) * 0.55 : Math.max(0, 1 - (l - 0.2) / 0.8) * 0.55;
    });

    arcs.forEach(l => {
      l.userData.life += dt * l.userData.speed * b;
      if (l.userData.life > 1) {
        l.userData.life = 0;
        l.userData.speed = 0.4 + Math.random() * 0.6;
        setArcPositions(l, 2.02);
      }
      l.material.opacity = Math.sin(l.userData.life * Math.PI) * 0.7;
    });

    textSprites.forEach(s => {
      const u = s.userData;
      u.phase += dt * u.speed * b;
      const a = timeAccum * u.orbit;
      const c = Math.cos(a), si = Math.sin(a);
      s.position.x = u.baseP.x * c - u.baseP.z * si;
      s.position.z = u.baseP.x * si + u.baseP.z * c;
      s.position.y = u.baseP.y + Math.sin(u.phase) * 0.12;
      s.material.opacity = 0.35 + 0.55 * (0.5 + 0.5 * Math.sin(u.phase * 1.7));
    });

    // Position bin anchored to camera bottom-right
    camera.updateMatrixWorld();
    camRight.setFromMatrixColumn(camera.matrixWorld, 0);
    camUp.setFromMatrixColumn(camera.matrixWorld, 1);
    camFwd.set(-camera.matrixWorld.elements[8], -camera.matrixWorld.elements[9], -camera.matrixWorld.elements[10]).normalize();
    const binPos = camera.position.clone()
      .add(camFwd.clone().multiplyScalar(3.5))
      .add(camRight.clone().multiplyScalar(1.6))
      .add(camUp.clone().multiplyScalar(-1.0));
    binGroup.position.copy(binPos);
    // Y-only rotation toward camera
    binGroup.rotation.y = Math.atan2(camera.position.x - binPos.x, camera.position.z - binPos.z);

    const bf = binGroup.userData.flash;
    binGroup.userData.flash = Math.max(0, bf - dt * 2);
    binMesh.material.opacity = Math.min(1, 0.4 + 0.15 * Math.sin(timeAccum * 2) + bf * 0.5);
    binRing.material.opacity = Math.min(1, 0.5 + bf * 0.5);
    binGlow.material.opacity = Math.min(1, 0.1 + bf * 0.4);

    // Task chips
    for (let i = tasks.length - 1; i >= 0; i--) {
      const t = tasks[i];
      if (t === carriedTask) continue;
      if (t.flight) {
        t.flight.t += dt / t.flight.dur;
        if (t.flight.t >= 1) {
          scene.remove(t.sprite);
          try { t.sprite.material.map?.dispose(); t.sprite.material.dispose(); } catch {}
          tasks.splice(i, 1);
          continue;
        }
        const e = 1 - Math.pow(1 - t.flight.t, 2);
        t.sprite.position.lerpVectors(t.flight.from, t.flight.to, e);
        t.sprite.material.opacity = 1 - t.flight.t * 0.5;
        t.sprite.scale.setScalar(1.5 * (1 - t.flight.t * 0.5));
        continue;
      }
      const a = t.baseAngle + timeAccum * 0.15;
      t.sprite.position.set(
        Math.cos(a) * t.baseRadius,
        t.baseHeight + Math.sin(timeAccum + t.phase) * 0.15,
        Math.sin(a) * t.baseRadius
      );
      if (t !== hoveredTask) t.sprite.scale.set(1.5, 0.375, 1);
    }

    composer.render();

    frames++; fpsTime += dt;
    if (fpsTime >= 1) { fpsEl.textContent = 'FPS: ' + frames; frames = 0; fpsTime = 0; }
  } catch (e) {
    console.error('Frame error:', e);
  }
}

  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  const cfg = Q[currentQuality];
  if (cfg.bloom) bloomPass.setSize(innerWidth * 0.5, innerHeight * 0.5);
});

addEventListener('beforeunload', () => {
  try { speechSynthesis.cancel(); } catch {}
  try { recognition?.stop(); } catch {}
});
</script>
</body>
