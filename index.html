<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<body>
<div id="info" class="u"><strong>Ultron Voice AI</strong><br>Say <em>"Hello Ultron"</em> to wake<br>Pinch + drag • Two hands to zoom</div>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {FilesetResolver,HandLandmarker} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs';

// ---- CONFIG ----
const ENDPOINT='https://api.llm7.io/v1/chat/completions';
const MODEL='gpt-4o-mini';
const SYSTEM='You are ULTRON, a cold, efficient AI hologram. Answer concisely in 1-3 sentences. Slightly menacing, technical tone. No emojis, no markdown.';
const WAKE=['hello ultron','hey ultron','hi ultron','hello altar','hey altar','hello ultra','hey ultra'];
const STORAGE_KEY='ultron_llm7_key';
const WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm';
const MODEL_URL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

// ---- DOM ----
const $=id=>document.getElementById(id);
const statusEl=$('status-text'),statusMode=document.querySelector('#status .mode');
const responseEl=$('response'),startBtn=$('start-btn'),qualityBtn=$('quality-btn');
const keyBtn=$('key-btn'),keyModal=$('key-modal'),keyInput=$('key-input'),keyError=$('key-error');
const fpsEl=$('fps'),video=$('input_video');
const setStatus=(m,t)=>{statusMode.textContent=m;statusEl.textContent=t};

// ---- STATE ----
let API_KEY=localStorage.getItem(STORAGE_KEY)||'';
let thinkingBoost=0,isAwake=false,isProcessing=false,commandBuffer='';
let wakeTimer=null,typewriterTimer=null;
let handFrameInterval=1000/20;
let targetRotX=0,targetRotY=0,targetZoom=5.5,handDetected=false,prevHandPos=null,prevPinchDist=null;
let currentQuality='performance';
let handLandmarker=null,lastVideoTime=-1,lastHandRun=0,recognition=null;

const Q={performance:{pr:1,bloom:0,br:.5,seg:20,pc:200,dc:120,gc:200,rs:64,sc:18,ac:4,puc:3,hfps:20},balanced:{pr:1.25,bloom:1,br:.5,seg:28,pc:350,dc:220,gc:400,rs:96,sc:30,ac:7,puc:4,hfps:24},ultra:{pr:1.5,bloom:1,br:.75,seg:36,pc:500,dc:350,gc:700,rs:120,sc:45,ac:10,puc:6,hfps:30}};

// ---- KEY MODAL ----
function showKey(msg=''){keyInput.value=API_KEY||'';keyError.textContent=msg;keyModal.classList.add('active');setTimeout(()=>keyInput.focus(),100)}
function hideKey(){keyModal.classList.remove('active');keyError.textContent=''}
$('key-save').onclick=()=>{const v=keyInput.value.trim();if(!v){keyError.textContent='Key cannot be empty.';return}if(v.length<8){keyError.textContent='Key too short.';return}API_KEY=v;localStorage.setItem(STORAGE_KEY,v);hideKey();showResponse('Access key saved. Systems ready.',false)};
$('key-clear').onclick=()=>{keyInput.value='';keyError.textContent=''};
$('key-skip').onclick=()=>{hideKey();showResponse('Running without API key. Voice Q&A disabled.',false)};
keyInput.addEventListener('keydown',e=>{if(e.key==='Enter')$('key-save').click()});
keyBtn.onclick=()=>showKey('Change your key.');
if(!API_KEY)setTimeout(()=>showKey(),300);

// ---- SCENE ----
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
camera.position.set(0,.3,5.5);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
document.body.appendChild(renderer.domElement);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth*.5,innerHeight*.5),1.6,.4,.25);
bloom.enabled=false;composer.addPass(bloom);

// ---- SHARED TIME UNIFORM (for per-particle motion shader) ----
const uTime={value:0};

// ---- TEXTURES ----
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const grad=g.createRadialGradient(32,32,0,32,32,32);grad.addColorStop(0,'rgba(255,220,180,1)');grad.addColorStop(.25,'rgba(255,140,40,.9)');grad.addColorStop(.6,'rgba(255,68,0,.35)');grad.addColorStop(1,'rgba(255,68,0,0)');g.fillStyle=grad;g.fillRect(0,0,64,64);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t})();
const makeTex=text=>{const c=document.createElement('canvas');c.width=512;c.height=64;const g=c.getContext('2d');g.font='bold 26px monospace';g.fillStyle='#ff5500';g.textBaseline='middle';g.shadowColor='#ff5500';g.shadowBlur=10;g.fillText(text,10,32);g.shadowBlur=20;g.fillText(text,10,32);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t};
const WORDS=['SCANNING...','SEARCHING','ANALYZING','TRACING','TARGET','LOCK','ROUTING','DECRYPT','ACCESS','COMPILE','PROCESS','FRAGMENT','QUERYING','MAPPING','PARSING','DIRECTIVE','PRIORITY','PROTOCOL','0x4F2A','0xBEEF','01001110','SYS://','>>>','NULL','PING','TRACE','DATA','LOG//','NODE_7','SECTOR 4','LISTENING','AWAITING','STANDBY'];
const textTexs=WORDS.map(makeTex);

// ---- ORB ----
const orb=new THREE.Group();scene.add(orb);
let shell,innerShell,core,particles,debris,dust,rings=[],pulses=[],arcs=[],sprites=[];

const randPt=r=>{const p=Math.acos(2*Math.random()-1),t=Math.random()*Math.PI*2;return new THREE.Vector3(r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))};
const setArc=(line,r)=>{const s=randPt(r),e=randPt(r);const m=s.clone().add(e).multiplyScalar(.5).normalize().multiplyScalar(r*1.45);const pts=new THREE.QuadraticBezierCurve3(s,m,e).getPoints(30);const pos=line.geometry.attributes.position;for(let i=0;i<pts.length;i++)pos.setXYZ(i,pts[i].x,pts[i].y,pts[i].z);pos.needsUpdate=true;line.geometry.computeBoundingSphere()};

// --- INDIVIDUAL PARTICLE MOTION via GPU ---
function applyMotionShader(mat, wobble, swirl){
  mat.onBeforeCompile=shader=>{
    shader.uniforms.uTime=uTime;
    shader.uniforms.uWobble={value:wobble};
    shader.uniforms.uSwirl={value:swirl};
    shader.vertexShader=`
      uniform float uTime;
      uniform float uWobble;
      uniform float uSwirl;
      attribute float aSeed;
    `+shader.vertexShader;
    shader.vertexShader=shader.vertexShader.replace(
      '#include <begin_vertex>',
      `
      vec3 transformed = vec3(position);
      float t = uTime + aSeed;
      // Per-particle radial breathing
      float r = length(transformed);
      vec3 dir = transformed / max(r, 0.0001);
      transformed += dir * sin(t * 1.2) * uWobble;
      // Per-particle 3D drift (each axis at different freq + phase)
      transformed.x += sin(t * 0.6 + aSeed * 1.7) * uWobble * 0.8;
      transformed.y += cos(t * 0.8 + aSeed * 2.3) * uWobble * 0.8;
      transformed.z += sin(t * 1.0 + aSeed * 3.1) * uWobble * 0.8;
      // Slow orbital swirl around Y axis (individual speed per particle)
      float ang = t * uSwirl * (0.4 + fract(aSeed * 0.159) * 0.6);
      float cs = cos(ang), sn = sin(ang);
      transformed.xz = mat2(cs, -sn, sn, cs) * transformed.xz;
      `
    );
  };
  mat.customProgramCacheKey=()=>'motion_'+wobble+'_'+swirl;
}

function makePoints(count,rfn,color,size,opacity,wobble,swirl){
  const g=new THREE.BufferGeometry();
  const p=new Float32Array(count*3);
  const seeds=new Float32Array(count);
  for(let i=0;i<count;i++){
    const v=randPt(rfn());
    p[i*3]=v.x;p[i*3+1]=v.y;p[i*3+2]=v.z;
    seeds[i]=Math.random()*Math.PI*2;
  }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seeds,1));
  const m=new THREE.PointsMaterial({map:glowTex,color,size,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  applyMotionShader(m,wobble,swirl);
  return new THREE.Points(g,m);
}

function buildOrb(q){
  while(orb.children.length){const c=orb.children.pop();c.geometry?.dispose();if(c.material)(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose())}
  rings=[];pulses=[];arcs=[];sprites=[];
  const cfg=Q[q];

  shell=new THREE.Mesh(new THREE.SphereGeometry(2,cfg.seg,cfg.seg),new THREE.MeshBasicMaterial({color:0xff4400,wireframe:true,transparent:true,opacity:.13}));orb.add(shell);
  innerShell=new THREE.Mesh(new THREE.SphereGeometry(1.85,cfg.seg,cfg.seg),new THREE.MeshBasicMaterial({color:0xff6600,wireframe:true,transparent:true,opacity:.07}));orb.add(innerShell);
  core=new THREE.Mesh(new THREE.TorusKnotGeometry(.55,.1,40,6,2,3),new THREE.MeshBasicMaterial({color:0xff2200,wireframe:true,transparent:true,opacity:.55}));orb.add(core);

  // Main particles: tiny wobble, slow swirl
  particles=makePoints(cfg.pc,()=>2.02,0xffaa44,.11,1.0,0.05,0.15);orb.add(particles);
  // Debris: more wobble, faster swirl
  debris=makePoints(cfg.dc,()=>2.15+Math.random()*.9,0xff7700,.07,.85,0.14,0.30);orb.add(debris);
  // Dust: gentle wobble, medium swirl
  dust=makePoints(cfg.gc,()=>.4+Math.random()*1.5,0xff3300,.035,.55,0.08,0.22);orb.add(dust);

  for(let i=0;i<3;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(2.3+i*.2,.008,8,cfg.rs),new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:.4}));r.rotation.x=Math.PI/2;r.rotation.y=i*Math.PI/3;orb.add(r);rings.push(r)}

  for(let i=0;i<cfg.puc;i++){const p=new THREE.Mesh(new THREE.RingGeometry(1.85,2.05,64),new THREE.MeshBasicMaterial({color:0xff7700,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));p.rotation.x=Math.random()*Math.PI;p.rotation.y=Math.random()*Math.PI;p.userData={life:Math.random(),speed:.35+Math.random()*.4};orb.add(p);pulses.push(p)}

  for(let i=0;i<cfg.ac;i++){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(31*3),3));const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xff8800,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));setArc(l,2.02);l.userData={life:Math.random(),speed:.5+Math.random()*.5};orb.add(l);arcs.push(l)}

  for(let i=0;i<cfg.sc;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:textTexs[i%textTexs.length],color:0xffffff,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));const p=randPt(1.9+Math.random()*1.5);s.position.copy(p);const sc=.55+Math.random()*.35;s.scale.set(sc,sc*.13,1);s.userData={baseP:p.clone(),phase:Math.random()*Math.PI*2,speed:.4+Math.random()*.6,orbit:.05+Math.random()*.1};orb.add(s);sprites.push(s)}
}

function applyQuality(q){
  currentQuality=q;const cfg=Q[q];
  renderer.setPixelRatio(Math.min(devicePixelRatio,cfg.pr));
  renderer.setSize(innerWidth,innerHeight);
  bloom.enabled=!!cfg.bloom;
  if(cfg.bloom)bloom.setSize(innerWidth*cfg.br,innerHeight*cfg.br);
  composer.setSize(innerWidth,innerHeight);
  handFrameInterval=1000/cfg.hfps;
  buildOrb(q);
  qualityBtn.textContent=`Quality: ${q[0].toUpperCase()+q.slice(1)}`;
}

// ---- HAND TRACKING ----
async function startCamera(){
  if(handLandmarker)return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:480,height:360,facingMode:'user'},audio:false});
    video.srcObject=stream;await video.play();
    const fs=await FilesetResolver.forVisionTasks(WASM);
    const opts={baseOptions:{modelAssetPath:MODEL_URL,delegate:'GPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5};
    try{handLandmarker=await HandLandmarker.createFromOptions(fs,opts)}catch{opts.baseOptions.delegate='CPU';handLandmarker=await HandLandmarker.createFromOptions(fs,opts)}
    detectLoop();
  }catch(e){console.warn('Camera unavailable:',e.message)}
}
function detectLoop(){
  if(!handLandmarker)return;
  const now=performance.now();
  if(video.readyState>=2&&now-lastHandRun>handFrameInterval&&video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;lastHandRun=now;
    try{processHands(handLandmarker.detectForVideo(video,now))}catch{}
  }
  requestAnimationFrame(detectLoop);
}
function processHands(r){
  const hands=r.landmarks||[];
  if(!hands.length){handDetected=false;prevHandPos=null;prevPinchDist=null;return}
  handDetected=true;
  if(hands.length===1){
    const h=hands[0],pinch=Math.hypot(h[8].x-h[4].x,h[8].y-h[4].y);
    if(pinch<.08){const px=1-h[9].x,py=h[9].y;if(prevHandPos){targetRotY+=(px-prevHandPos.x)*3;targetRotX+=(py-prevHandPos.y)*3}prevHandPos={x:px,y:py}}else prevHandPos=null;
  }else if(hands.length===2){
    const[h1,h2]=hands;
    const d1=Math.hypot(h1[8].x-h1[4].x,h1[8].y-h1[4].y),d2=Math.hypot(h2[8].x-h2[4].x,h2[8].y-h2[4].y);
    if(d1<.08&&d2<.08){const dist=Math.hypot(h1[9].x-h2[9].x,h1[9].y-h2[9].y);if(prevPinchDist){targetZoom-=(dist-prevPinchDist)*15;targetZoom=Math.max(2,Math.min(12,targetZoom))}prevPinchDist=dist}else prevPinchDist=null;
  }
}

// ---- SPEECH OUTPUT ----
if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
function speak(text){
  if(!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);u.rate=1;u.pitch=.7;u.volume=1;
  const v=speechSynthesis.getVoices().find(v=>/Google UK English Male|Daniel|Microsoft David|Microsoft Guy/i.test(v.name));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}

// ---- SPEECH INPUT ----
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startRecognition(){
  if(!SR){setStatus('ERROR','Use Chrome or Edge for speech.');return}
  recognition=new SR();recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-US';
  recognition.onresult=handleSpeech;
  recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed')setStatus('BLOCKED','Microphone access denied')};
  recognition.onend=()=>{if(!isProcessing)try{recognition.start()}catch{}};
  try{recognition.start()}catch{}
}
function handleSpeech(event){
  if(isProcessing)return;
  let interim='',final='';
  for(let i=event.resultIndex;i<event.results.length;i++){
    const t=event.results[i][0].transcript;
    if(event.results[i].isFinal)final+=t+' ';else interim+=t;
  }
  const text=(final||interim).toLowerCase().trim();
  if(!text)return;
  if(!isAwake){
    for(const w of WAKE){
      const i=text.indexOf(w);
      if(i!==-1){
        isAwake=true;commandBuffer=text.slice(i+w.length).trim();
        setStatus('AWAKE','Listening...');thinkingBoost=.5;
        if(commandBuffer.length>2)runCommand(commandBuffer);
        else{speak('Yes?');clearTimeout(wakeTimer);wakeTimer=setTimeout(()=>{if(isAwake&&!isProcessing){isAwake=false;setStatus('STANDBY','Say "Hello Ultron" to wake');thinkingBoost=0}},8000)}
        break;
      }
    }
  }else if(final){
    commandBuffer+=' '+final.trim();
    if(commandBuffer.trim().length>2){clearTimeout(wakeTimer);runCommand(commandBuffer.trim());commandBuffer=''}
  }
}

// ---- LLM7 ----
const history=[{role:'system',content:SYSTEM}];
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showThinking(){responseEl.classList.add('active');responseEl.innerHTML='<span class="label">// ULTRON</span><span class="think">Processing</span>'}
function showResponse(text,animate=true){
  responseEl.classList.add('active');
  if(!animate){responseEl.innerHTML=`<span class="label">// ULTRON</span>${esc(text)}`;return}
  responseEl.innerHTML='<span class="label">// ULTRON</span><span id="typed"></span><span class="caret"></span>';
  const el=$('typed');let i=0;clearInterval(typewriterTimer);
  typewriterTimer=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typewriterTimer)},18);
}
async function runCommand(q){
  if(isProcessing)return;
  if(!API_KEY){showResponse('No API key set. Click KEY (top right).',false);speak('No access key configured.');isAwake=false;setStatus('STANDBY','Say "Hello Ultron" to wake');thinkingBoost=0;return}
  isProcessing=true;thinkingBoost=1;
  setStatus('PROCESSING','Analyzing: "'+q.slice(0,40)+(q.length>40?'...':'')+'"');
  showThinking();history.push({role:'user',content:q});
  try{
    const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},body:JSON.stringify({model:MODEL,messages:history,temperature:.7,max_tokens:250})});
    if(res.status===401||res.status===403)throw new Error('AUTH');
    if(!res.ok)throw new Error('HTTP '+res.status+': '+(await res.text()).slice(0,150));
    const data=await res.json();
    const ans=data.choices?.[0]?.message?.content?.trim()||'(no response)';
    history.push({role:'assistant',content:ans});if(history.length>12)history.splice(1,2);
    showResponse(ans,true);speak(ans);
    setStatus('AWAKE','Listening for your next command...');
    clearTimeout(wakeTimer);
    wakeTimer=setTimeout(()=>{if(isAwake&&!isProcessing){isAwake=false;setStatus('STANDBY','Say "Hello Ultron" to wake');thinkingBoost=0;responseEl.classList.remove('active')}},12000);
  }catch(err){
    console.error(err);
    if(err.message==='AUTH'){showResponse('API key rejected. Click KEY to update.',false);speak('Access denied.');showKey('Saved key was rejected. Enter a valid one.')}
    else{showResponse('Connection error: '+err.message,false);speak('Connection error.')}
    setStatus('ERROR','Request failed');
    setTimeout(()=>{isAwake=false;setStatus('STANDBY','Say "Hello Ultron" to wake');thinkingBoost=0},3000);
  }finally{isProcessing=false}
}

// ---- ACTIVATION ----
startBtn.onclick=async()=>{
  startBtn.style.display='none';
  setStatus('STARTING','Initializing systems...');
  await startCamera();
  startRecognition();
  setTimeout(()=>{setStatus('STANDBY','Say "Hello Ultron" to wake');speak('Systems online. Say hello Ultron to activate.')},500);
};
const order=['performance','balanced','ultra'];
qualityBtn.onclick=()=>applyQuality(order[(order.indexOf(currentQuality)+1)%order.length]);

// ---- ANIMATE ----
const clock=new THREE.Clock();
let frames=0,fpsTime=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(),t=clock.getElapsedTime(),b=1+thinkingBoost*3;

  uTime.value=t;

  if(!handDetected){targetRotY+=.003*b;targetRotX+=.0008*b}
  orb.rotation.x+=(targetRotX-orb.rotation.x)*.08;
  orb.rotation.y+=(targetRotY-orb.rotation.y)*.08;
  camera.position.z+=(targetZoom-camera.position.z)*.08;
  camera.lookAt(0,0,0);
  if(core){core.rotation.x+=dt*.6*b;core.rotation.y+=dt*.9*b}
  rings.forEach((r,i)=>r.rotation.z+=dt*.15*(i+1)*b);

  pulses.forEach(p=>{
    p.userData.life+=dt*p.userData.speed*b;
    if(p.userData.life>1){p.userData.life=0;p.rotation.x=Math.random()*Math.PI;p.rotation.y=Math.random()*Math.PI}
    const l=p.userData.life;p.scale.setScalar(.7+l*1.6);
    p.material.opacity=l<.2?(l/.2)*.55:Math.max(0,1-(l-.2)/.8)*.55;
  });
  arcs.forEach(l=>{
    l.userData.life+=dt*l.userData.speed*b;
    if(l.userData.life>1){l.userData.life=0;l.userData.speed=.4+Math.random()*.6;setArc(l,2.02)}
    l.material.opacity=Math.sin(l.userData.life*Math.PI)*.7;
  });
  sprites.forEach(s=>{
    const u=s.userData;u.phase+=dt*u.speed*b;
    const a=t*u.orbit*b,c=Math.cos(a),si=Math.sin(a);
    s.position.x=u.baseP.x*c-u.baseP.z*si;
    s.position.z=u.baseP.x*si+u.baseP.z*c;
    s.position.y=u.baseP.y+Math.sin(u.phase)*.12;
    s.material.opacity=.35+.55*(.5+.5*Math.sin(u.phase*1.7));
  });
  composer.render();
  frames++;fpsTime+=dt;
  if(fpsTime>=1){fpsEl.textContent='FPS: '+frames;frames=0;fpsTime=0}
}
applyQuality('performance');
animate();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
  const cfg=Q[currentQuality];if(cfg.bloom)bloom.setSize(innerWidth*cfg.br,innerHeight*cfg.br);
});
</script>
