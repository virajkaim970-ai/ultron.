<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#ff4400}
.u{position:fixed;background:rgba(0,0,0,.75);border:1px solid rgba(255,68,0,.4);border-radius:8px;padding:8px 14px;font:12px 'Courier New',monospace;text-shadow:0 0 6px #ff4400;z-index:10}
#info{top:15px;left:15px;font-size:12px;line-height:1.6;pointer-events:none;max-width:260px}

#video-container{position:fixed;bottom:20px;right:20px;width:200px;height:150px;border:1px solid #ff4400;border-radius:8px;overflow:hidden;z-index:10;opacity:.85;box-shadow:0 0 20px rgba(255,68,0,.3);background:#000}
#input_video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#response{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:15;width:min(700px,calc(100% - 40px));max-height:40vh;overflow-y:auto;background:rgba(5,0,0,.8);color:#ffcc88;border:1px solid rgba(255,68,0,.5);border-radius:10px;padding:16px 20px;font:14px/1.6 'Courier New',monospace;text-shadow:0 0 6px rgba(255,68,0,.7);box-shadow:0 0 30px rgba(255,68,0,.25);opacity:0;pointer-events:none;transition:opacity .35s;white-space:pre-wrap}
#response.active{opacity:1}

#response .caret{display:inline-block;width:8px;height:14px;background:#ff5500;margin-left:2px;vertical-align:text-bottom;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.think::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

#key-actions{display:flex;gap:8px;margin-top:16px}
#key-actions button{flex:1;padding:10px 14px;font:12px 'Courier New',monospace;font-weight:bold;background:rgba(255,68,0,.15);color:#ff4400;border:1px solid #ff4400;border-radius:6px;cursor:pointer;letter-spacing:2px;text-transform:uppercase}
#key-actions button:hover{background:rgba(255,68,0,.35)}
</style>

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {FilesetResolver,HandLandmarker} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs';

// ---- CONFIG ----
const ENDPOINT='https://api.llm7.io/v1/chat/completions';
const MODEL='gpt-4o-mini';
const SYSTEM='You are ULTRON, a cold, efficient AI hologram. Answer in 1-3 concise sentences. Menacing, technical tone. No emojis, no markdown.';
const WAKE=['hello ultron','hey ultron','hi ultron','hello ultra','hey ultra'];
const STORAGE_KEY='ultron_key';
const WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm';
const MODEL_URL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const SS={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch{return false}}};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---- DOM ----
const $=id=>document.getElementById(id);
const statusEl=$('status-text'),statusMode=document.querySelector('#status .mode');
const hudEl=$('hud'),responseEl=$('response'),startBtn=$('start-btn'),qualityBtn=$('quality-btn');
const keyBtn=$('key-btn'),keyModal=$('key-modal'),keyInput=$('key-input'),keyError=$('key-error');
const fpsEl=$('fps'),video=$('input_video');
const setStatus=(m,t)=>{statusMode.textContent=m;statusEl.textContent=t};

// ---- STATE ----
let API_KEY=SS.get(STORAGE_KEY)||'';
let thinkingBoost=0,isAwake=false,isProcessing=false,commandBuffer='';
let wakeTimer=null,typewriterTimer=null,srRestartTimer=null,srRestarts=0,srBlocked=false;
let handFrameInterval=1000/20,targetRotX=0,targetRotY=0,targetZoom=5.5;
let handDetected=false,rotYVel=0,rotXVel=0;
let prevPalm=null,prevHandSize=null,prevTwoDist=null;
let currentQuality='performance';
let handLandmarker=null,lastVideoTime=-1,lastHandRun=0,recognition=null,cameraReady=false;
let gestureMode='idle',hoveredTask=null,carriedTask=null;

const Q={performance:{pr:1,bloom:0,seg:20,pc:200,dc:120,gc:200,hfps:20},balanced:{pr:1.25,bloom:1,seg:26,pc:320,dc:200,gc:350,hfps:24},ultra:{pr:1.5,bloom:1,seg:32,pc:450,dc:300,gc:600,hfps:30}};

// ---- KEY MODAL ----
function showKey(msg=''){keyInput.value=API_KEY||'';keyError.textContent=msg;keyModal.classList.add('active');setTimeout(()=>keyInput.focus(),100)}
function hideKey(){keyModal.classList.remove('active')}
$('key-save').onclick=()=>{const v=keyInput.value.trim();if(v.length<8){keyError.textContent='Key too short.';return}API_KEY=v;SS.set(STORAGE_KEY,v);hideKey();showResponse('Key saved.',false)};
$('key-clear').onclick=()=>keyInput.value='';
keyInput.addEventListener('keydown',e=>{if(e.key==='Enter')$('key-save').click()});
keyBtn.onclick=()=>showKey();
if(!API_KEY)setTimeout(()=>showKey(),300);

// ---- SCENE ----
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
camera.position.set(0,.3,5.5);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;
document.body.appendChild(renderer.domElement);
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth*.5,innerHeight*.5),1.6,.4,.25);
bloom.enabled=false;composer.addPass(bloom);
const uTime={value:0};

// ---- TEXTURES ----
const glowTex=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,220,180,1)');gr.addColorStop(.25,'rgba(255,140,40,.9)');gr.addColorStop(.6,'rgba(255,68,0,.35)');gr.addColorStop(1,'rgba(255,68,0,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t})();
const makeTex=txt=>{const c=document.createElement('canvas');c.width=512;c.height=64;const g=c.getContext('2d');g.font='bold 26px monospace';g.fillStyle='#ff5500';g.textBaseline='middle';g.shadowColor='#ff5500';g.shadowBlur=10;g.fillText(txt,10,32);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t};
const WORDS=['SCANNING...','SEARCHING','ANALYZING','TRACING','TARGET','LOCK','ROUTING','DECRYPT','ACCESS','COMPILE','PROCESS','FRAGMENT','QUERYING','MAPPING','PARSING','DIRECTIVE','PRIORITY','PROTOCOL','0x4F2A','0xBEEF','01001110','SYS://','NULL','PING','TRACE','DATA','LOG//','NODE_7','SECTOR 4','LISTENING','STANDBY'];
const textTexs=WORDS.map(makeTex);

// ---- ORB ----
const orb=new THREE.Group();scene.add(orb);
let shell,innerShell,core,particles,debris,dust,rings=[],pulses=[],arcs=[],sprites=[];

const randPt=r=>{const p=Math.acos(2*Math.random()-1),t=Math.random()*Math.PI*2;return new THREE.Vector3(r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))};
const setArc=(line,r)=>{const s=randPt(r),e=randPt(r);const m=s.clone().add(e).multiplyScalar(.5).normalize().multiplyScalar(r*1.45);const pts=new THREE.QuadraticBezierCurve3(s,m,e).getPoints(30);const pos=line.geometry.attributes.position;for(let i=0;i<pts.length;i++)pos.setXYZ(i,pts[i].x,pts[i].y,pts[i].z);pos.needsUpdate=true;line.geometry.computeBoundingSphere()};

function applyMotionShader(mat,wobble,swirl){
  mat.onBeforeCompile=s=>{
    s.uniforms.uTime=uTime;s.uniforms.uWobble={value:wobble};s.uniforms.uSwirl={value:swirl};
    s.vertexShader=`uniform float uTime;uniform float uWobble;uniform float uSwirl;attribute float aSeed;`+s.vertexShader;
    s.vertexShader=s.vertexShader.replace('#include <begin_vertex>',`
      vec3 transformed=vec3(position);
      float t=uTime+aSeed;
      float r=length(transformed);
      vec3 dir=transformed/max(r,0.0001);
      transformed+=dir*sin(t*1.2)*uWobble;
      transformed.x+=sin(t*0.6+aSeed*1.7)*uWobble*0.8;
      transformed.y+=cos(t*0.8+aSeed*2.3)*uWobble*0.8;
      transformed.z+=sin(t*1.0+aSeed*3.1)*uWobble*0.8;
      float ang=t*uSwirl*(0.4+fract(aSeed*0.159)*0.6);
      float cs=cos(ang),sn=sin(ang);
      transformed.xz=mat2(cs,-sn,sn,cs)*transformed.xz;
    `);
  };
  mat.customProgramCacheKey=()=>'m_'+wobble+'_'+swirl;
}

function makePoints(count,rfn,color,size,opacity,wobble,swirl){
  const g=new THREE.BufferGeometry(),p=new Float32Array(count*3),seeds=new Float32Array(count);
  for(let i=0;i<count;i++){const v=randPt(rfn());p[i*3]=v.x;p[i*3+1]=v.y;p[i*3+2]=v.z;seeds[i]=Math.random()*Math.PI*2}
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seeds,1));
  const m=new THREE.PointsMaterial({map:glowTex,color,size,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});
  applyMotionShader(m,wobble,swirl);
  return new THREE.Points(g,m);
}

function buildOrb(q){
  while(orb.children.length){const c=orb.children.pop();c.geometry?.dispose();if(c.material)(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose())}
  rings=[];pulses=[];arcs=[];sprites=[];
  const cfg=Q[q];
  shell=new THREE.Mesh(new THREE.SphereGeometry(2,cfg.seg,cfg.seg),new THREE.MeshBasicMaterial({color:0xff4400,wireframe:true,transparent:true,opacity:.13}));orb.add(shell);
  innerShell=new THREE.Mesh(new THREE.SphereGeometry(1.85,cfg.seg,cfg.seg),new THREE.MeshBasicMaterial({color:0xff6600,wireframe:true,transparent:true,opacity:.07}));orb.add(innerShell);
  core=new THREE.Mesh(new THREE.TorusKnotGeometry(.55,.1,40,6,2,3),new THREE.MeshBasicMaterial({color:0xff2200,wireframe:true,transparent:true,opacity:.55}));orb.add(core);
  particles=makePoints(cfg.pc,()=>2.02,0xffaa44,.11,1,0.05,0.15);orb.add(particles);
  debris=makePoints(cfg.dc,()=>2.15+Math.random()*.9,0xff7700,.07,.85,0.14,0.30);orb.add(debris);
  dust=makePoints(cfg.gc,()=>.4+Math.random()*1.5,0xff3300,.035,.55,0.08,0.22);orb.add(dust);
  for(let i=0;i<3;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(2.3+i*.2,.008,8,64),new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:.4}));r.rotation.x=Math.PI/2;r.rotation.y=i*Math.PI/3;orb.add(r);rings.push(r)}
  for(let i=0;i<cfg.puc||3;i++){const p=new THREE.Mesh(new THREE.RingGeometry(1.85,2.05,48),new THREE.MeshBasicMaterial({color:0xff7700,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));p.rotation.x=Math.random()*Math.PI;p.rotation.y=Math.random()*Math.PI;p.userData={life:Math.random(),speed:.35+Math.random()*.4};orb.add(p);pulses.push(p)}
  const arcN=Q[q].ac||4;
  for(let i=0;i<arcN;i++){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(31*3),3));const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xff8800,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));setArc(l,2.02);l.userData={life:Math.random(),speed:.5+Math.random()*.5};orb.add(l);arcs.push(l)}
  const spN=Q[q].sc||16;
  for(let i=0;i<spN;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:textTexs[i%textTexs.length],color:0xffffff,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));const p=randPt(1.9+Math.random()*1.5);s.position.copy(p);const sc=.55+Math.random()*.35;s.scale.set(sc,sc*.13,1);s.userData={baseP:p.clone(),phase:Math.random()*Math.PI*2,speed:.4+Math.random()*.6,orbit:.05+Math.random()*.1};orb.add(s);sprites.push(s)}
}

// ---- DUSTBIN (3D, follows camera) ----
const binGroup=new THREE.Group();scene.add(binGroup);
let binMesh,binRing,binGlow;
{
  const binGeo=new THREE.CylinderGeometry(.5,.35,.9,16,1,true);
  binMesh=new THREE.Mesh(binGeo,new THREE.MeshBasicMaterial({color:0xff4400,wireframe:true,transparent:true,opacity:.5,side:THREE.DoubleSide}));
  binGroup.add(binMesh);
  binRing=new THREE.Mesh(new THREE.TorusGeometry(.5,.02,8,32),new THREE.MeshBasicMaterial({color:0xff8800,transparent:true,opacity:.8}));
  binRing.rotation.x=Math.PI/2;binRing.position.y=.45;binGroup.add(binRing);
  binGlow=new THREE.Mesh(new THREE.CircleGeometry(.5,24),new THREE.MeshBasicMaterial({color:0xff2200,transparent:true,opacity:.15,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));
  binGlow.rotation.x=-Math.PI/2;binGlow.position.y=.45;binGroup.add(binGlow);
  binGroup.userData={active:false,flash:0};
}

// ---- TASK CHIPS ----
const tasks=[];
const MAX_TASKS=6;
function makeChipTexture(text,state){
  const c=document.createElement('canvas');c.width=512;c.height=128;
  const g=c.getContext('2d');
  const colors={pending:['#ff9900','rgba(255,153,0,.15)'],working:['#ff6600','rgba(255,102,0,.25)'],done:['#88ff88','rgba(136,255,136,.15)'],failed:['#ff2200','rgba(255,34,0,.2)']};
  const [fg,bg]=colors[state]||colors.pending;
  g.fillStyle=bg;g.fillRect(0,0,512,128);
  g.strokeStyle=fg;g.lineWidth=3;g.strokeRect(2,2,508,124);
  g.font='bold 24px monospace';g.fillStyle=fg;g.textBaseline='middle';
  // Wrap text
  const maxW=470;const words=text.split(' ');let line='';const lines=[];
  for(const w of words){const test=line?line+' '+w:w;if(g.measureText(test).width>maxW){lines.push(line);line=w}else line=test}
  if(line)lines.push(line);
  lines.slice(0,3).forEach((l,i)=>g.fillText(l,20,44+i*32));
  // State indicator
  g.font='bold 16px monospace';g.fillStyle=fg;g.fillText(state.toUpperCase(),20,110);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function spawnTask(text){
  if(tasks.length>=MAX_TASKS){const old=tasks.shift();scene.remove(old.sprite);old.sprite.material.map.dispose();old.sprite.material.dispose()}
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,opacity:.95,depthWrite:false,depthTest:false}));
  sprite.scale.set(1.5,.375,1);
  const angle=Math.random()*Math.PI*2;
  const radius=2.7+Math.random()*.8;
  const height=(Math.random()-.5)*1.8;
  const task={sprite,text,state:'pending',baseAngle:angle,baseRadius:radius,baseHeight:height,phase:Math.random()*Math.PI*2,bornAt:performance.now(),flight:null};
  sprite.material.map=makeChipTexture(text,'pending');
  sprite.material.needsUpdate=true;
  scene.add(sprite);
  tasks.push(task);
  return task;
}
function setTaskState(task,state){
  task.state=state;
  if(task.sprite.material.map)task.sprite.material.map.dispose();
  task.sprite.material.map=makeChipTexture(task.text,state);
  task.sprite.material.needsUpdate=true;
}

// ---- HAND TRACKING ----
async function startCamera(){
  if(cameraReady)return true;
  if(!navigator.mediaDevices?.getUserMedia)return false;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});
    video.srcObject=stream;await video.play().catch(()=>{});
    const fs=await FilesetResolver.forVisionTasks(WASM);
    const opts={baseOptions:{modelAssetPath:MODEL_URL,delegate:'GPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5};
    try{handLandmarker=await HandLandmarker.createFromOptions(fs,opts)}
    catch{opts.baseOptions.delegate='CPU';handLandmarker=await HandLandmarker.createFromOptions(fs,opts)}
    cameraReady=true;detectLoop();return true;
  }catch(e){console.warn('Camera off:',e.message);return false}
}
function detectLoop(){
  if(!handLandmarker)return;
  const now=performance.now();
  if(video.readyState>=2&&now-lastHandRun>handFrameInterval&&video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;lastHandRun=now;
    try{processHands(handLandmarker.detectForVideo(video,now))}catch{}
  }
  requestAnimationFrame(detectLoop);
}

// Single-hand only for reliability. Analyze finger extension.
function analyze(h){
  const w=h[0];
  const ext=[dist(h[4],w)>dist(h[2],w)*1.12];
  for(const [tip,pip] of [[8,6],[12,10],[16,14],[20,18]])ext.push(dist(h[tip],w)>dist(h[pip],w)*1.15);
  const open=ext.filter(Boolean).length;
  const size=dist(h[0],h[9])+dist(h[5],h[17]);
  const palm={x:(h[0].x+h[5].x+h[9].x+h[13].x+h[17].x)/5,y:(h[0].y+h[5].y+h[9].y+h[13].y+h[17].y)/5};
  return {open,size,palm};
}

// Project 3D position to screen (normalized 0-1)
const projVec=new THREE.Vector3();
function screenPos(obj3d){
  projVec.copy(obj3d).project(camera);
  return {x:(projVec.x+.5),y:(.5-projVec.y)};
}

function processHands(r){
  const hands=r.landmarks||[];
  if(!hands.length){
    handDetected=false;prevPalm=null;prevHandSize=null;prevTwoDist=null;
    if(gestureMode==='carrying'&&carriedTask){
      // Auto-drop: release over bin if near, else return to orbit
      dropTask(carriedTask,false);
    }
    gestureMode='idle';carriedTask=null;hoveredTask=null;
    hudEl.textContent='MODE: IDLE';
    return;
  }
  handDetected=true;
  const h=hands[0];
  const info=analyze(h);
  const gesture=info.open>=4?'open':info.open<=1?'fist':'partial';

  // -------- CARRYING MODE --------
  if(gestureMode==='carrying'&&carriedTask){
    // Move chip to follow hand
    const p={x:1-info.palm.x,y:info.palm.y};
    if(handLandmarker&&video.videoWidth){
      // Convert to screen space, keep at fixed depth from camera
      const depth=3.5;
      const ndcX=(1-info.palm.x)*2-1;
      const ndcY=1-info.palm.y*2;
      const vec=new THREE.Vector3(ndcX,ndcY,.5).unproject(camera);
      const dir=vec.sub(camera.position).normalize();
      const pos=camera.position.clone().add(dir.multiplyScalar(depth));
      carriedTask.sprite.position.copy(pos);
    }
    hudEl.textContent='MODE: CARRYING · open palm over bin to toss';

    // Check if hand is over the bin
    if(info.open>=4){
      const handScreen={x:1-info.palm.x,y:info.palm.y};
      const binScreen=screenPos(binGroup.position.clone().add(new THREE.Vector3(0,.45,0)));
      const d=Math.hypot(handScreen.x-binScreen.x,handScreen.y-binScreen.y);
      if(d<0.18){dropTask(carriedTask,true);carriedTask=null;gestureMode='idle'}
    }
    return;
  }

  // -------- HOVER: check if fist is near a task --------
  if(gesture==='fist'&&tasks.length){
    const handScreen={x:1-info.palm.x,y:info.palm.y};
    let closest=null,closestD=0.15;
    for(const t of tasks){
      if(t===carriedTask)continue;
      const sp=screenPos(t.sprite.position);
      const d=Math.hypot(handScreen.x-sp.x,handScreen.y-sp.y);
      if(d<closestD){closest=t;closestD=d}
    }
    hoveredTask=closest;
    if(closest){
      hudEl.textContent='MODE: GRAB · open palm to confirm';
      closest.sprite.scale.set(1.7,.425,1);
      tasks.forEach(t=>{if(t!==closest)t.sprite.scale.set(1.5,.375,1)});
      // Grab on sustained fist proximity (auto-grab after a beat)
      if(prevPalm){
        // Auto grab — since fist near = intent
        carriedTask=closest;
        gestureMode='carrying';
        hudEl.textContent='MODE: CARRYING';
      }
    }else{
      hudEl.textContent='MODE: FIST · drag to spin';
      tasks.forEach(t=>t.sprite.scale.set(1.5,.375,1));
    }
  }else{
    tasks.forEach(t=>{if(t!==carriedTask)t.sprite.scale.set(1.5,.375,1)});
  }

  // -------- NORMAL CONTROL --------
  if(gesture==='open'){
    const p={x:1-info.palm.x,y:info.palm.y};
    if(prevPalm){
      const dx=p.x-prevPalm.x,dy=p.y-prevPalm.y;
      targetRotY+=dx*4.5;targetRotX+=dy*3.5;
      rotYVel=dx*2.5;rotXVel=dy*1.8;
    }
    prevPalm=p;
    if(prevHandSize){
      const dd=info.size-prevHandSize;
      if(Math.abs(dd)>0.008){targetZoom=clamp(targetZoom-dd*25,2,12)}
    }
    prevHandSize=info.size;
    if(gestureMode==='idle')hudEl.textContent='MODE: OPEN PALM · rotate · push to zoom';
  }else if(gesture==='fist'&&!hoveredTask){
    const p={x:1-info.palm.x,y:info.palm.y};
    if(prevPalm){
      const dx=p.x-prevPalm.x,dy=p.y-prevPalm.y;
      targetRotY+=dx*6.5;targetRotX+=dy*5.0;
      rotYVel=dx*4.0;rotXVel=dy*3.0;
    }
    prevPalm=p;prevHandSize=null;
    if(gestureMode==='idle')hudEl.textContent='MODE: FIST · fast spin';
  }else{
    prevPalm=null;prevHandSize=null;
  }
}

function dropTask(task,intoBin){
  if(!task)return;
  if(intoBin){
    const bp=binGroup.position.clone().add(new THREE.Vector3(0,.45,0));
    task.flight={from:task.sprite.position.clone(),to:bp,t:0,dur:.5};
    setTaskState(task,'done');
    binGroup.userData.flash=1;
  }else{
    // Return to orbit
    task.flight=null;
    setTaskState(task,'pending');
  }
}

// ---- SPEECH ----
if('speechSynthesis' in window){speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}
function speak(text){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel()}catch{}
  const u=new SpeechSynthesisUtterance(text);u.rate=1;u.pitch=.7;
  const v=speechSynthesis.getVoices().find(v=>/Google UK English Male|Daniel|David|Guy/i.test(v.name));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startRecognition(){
  if(!SR||srBlocked)return;
  try{recognition=new SR()}catch{return}
  recognition.continuous=true;recognition.interimResults=true;recognition.lang='en-US';
  recognition.onresult=handleSpeech;
  recognition.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){srBlocked=true;setStatus('BLOCKED','Mic denied')}};
  recognition.onend=()=>{
    if(isProcessing||srBlocked)return;
    srRestarts++;
    clearTimeout(srRestartTimer);
    srRestartTimer=setTimeout(()=>{try{recognition.start();srRestarts=Math.max(0,srRestarts-1)}catch{}},Math.min(200,50*srRestarts));
  };
  try{recognition.start();srRestarts=0}catch{}
}
function handleSpeech(event){
  if(isProcessing)return;
  let interim='',final='';
  for(let i=event.resultIndex;i<event.results.length;i++){
    const t=event.results[i][0].transcript;
    if(event.results[i].isFinal)final+=t+' ';else interim+=t;
  }
  const text=(final||interim).toLowerCase().trim();
  if(!text)return;
  if(!isAwake){
    for(const w of WAKE){
      const i=text.indexOf(w);
      if(i!==-1){
        isAwake=true;commandBuffer=text.slice(i+w.length).trim();
        setStatus('AWAKE','Listening...');thinkingBoost=.5;
        if(commandBuffer.length>2)runCommand(commandBuffer);
        else{speak('Yes?');clearTimeout(wakeTimer);wakeTimer=setTimeout(()=>{if(isAwake&&!isProcessing){isAwake=false;setStatus('STANDBY','Say "Hello Ultron" to wake');thinkingBoost=0}},8000)}
        break;
      }
    }
  }else if(final){
    commandBuffer+=' '+final.trim();
    if(commandBuffer.trim().length>2){clearTimeout(wakeTimer);runCommand(commandBuffer.trim());commandBuffer=''}
  }
}

// ---- LLM ----
const history=[{role:'system',content:SYSTEM}];
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showThinking(){responseEl.classList.add('active');responseEl.innerHTML='<span class="label">// ULTRON</span><span class="think">Processing</span>'}
function showResponse(text,animate=true){
  responseEl.classList.add('active');
  if(!animate){responseEl.innerHTML=`<span class="label">// ULTRON</span>${esc(text)}`;return}
  responseEl.innerHTML='<span class="label">// ULTRON</span><span id="typed"></span><span class="caret"></span>';
  const el=$('typed');if(!el)return;let i=0;clearInterval(typewriterTimer);
  typewriterTimer=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typewriterTimer)},18);
}
async function runCommand(q){
  if(isProcessing)return;
  if(!API_KEY){showResponse('No API key.',false);speak('No key.');isAwake=false;setStatus('STANDBY','Say "Hello Ultron" to wake');thinkingBoost=0;return}
  isProcessing=true;thinkingBoost=1;
  setStatus('PROCESSING',q.slice(0,40));
  showThinking();
  const task=spawnTask(q);
  setTaskState(task,'working');
  history.push({role:'user',content:q});
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),30000);
  try{
    const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},body:JSON.stringify({model:MODEL,messages:history,temperature:.7,max_tokens:220}),signal:controller.signal});
    clearTimeout(timeout);
    if(res.status===401||res.status===403)throw new Error('AUTH');
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const ans=data.choices?.[0]?.message?.content?.trim()||'(no response)';
    history.push({role:'assistant',content:ans});if(history.length>12)history.splice(1,2);
    setTaskState(task,'done');
    showResponse(ans,true);speak(ans);
    setStatus('AWAKE','Listening...');
    clearTimeout(wakeTimer);
    wakeTimer=setTimeout(()=>{if(isAwake&&!isProcessing){isAwake=false;setStatus('STANDBY','Say "Hello Ultron" to wake');thinkingBoost=0;responseEl.classList.remove('active')}},12000);
  }catch(err){
    clearTimeout(timeout);
    setTaskState(task,'failed');
    if(err.name==='AbortError'){showResponse('Timed out.',false);speak('Timed out.')}
    else if(err.message==='AUTH'){showResponse('Key rejected.',false);speak('Access denied.');showKey('Key rejected.')}
    else{showResponse('Error: '+err.message,false);speak('Error.')}
    setStatus('ERROR','Failed');
    setTimeout(()=>{isAwake=false;setStatus('STANDBY','Say "Hello Ultron" to wake');thinkingBoost=0},3000);
  }finally{isProcessing=false}
}

// ---- ACTIVATION ----
startBtn.onclick=async()=>{
  startBtn.style.display='none';
  setStatus('STARTING','Initializing...');
  const camOK=await startCamera();
  startRecognition();
  setTimeout(()=>{setStatus('STANDBY','Say "Hello Ultron" to wake'+(camOK?'':' (no cam)'));speak('Systems online.')},500);
};
const order=['performance','balanced','ultra'];
qualityBtn.onclick=()=>{
  const next=order[(order.indexOf(currentQuality)+1)%order.length];
  currentQuality=next;
  const cfg=Q[next];
  renderer.setPixelRatio(Math.min(devicePixelRatio,cfg.pr));
  renderer.setSize(innerWidth,innerHeight);
  bloom.enabled=!!cfg.bloom;
  composer.setSize(innerWidth,innerHeight);
  handFrameInterval=1000/cfg.hfps;
  buildOrb(next);
  qualityBtn.textContent=`Quality: ${next[0].toUpperCase()+next.slice(1)}`;
};

// ---- ANIMATE ----
const clock=new THREE.Clock();
let frames=0,fpsTime=0,timeAccum=0;
const camRight=new THREE.Vector3(),camUp=new THREE.Vector3(),camFwd=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta(),b=1+thinkingBoost*3;
  timeAccum+=dt*b;uTime.value=timeAccum;

  if(!handDetected){
    if(Math.abs(rotYVel)>.001||Math.abs(rotXVel)>.001){
      targetRotY+=rotYVel;targetRotX+=rotXVel;
      rotYVel*=.94;rotXVel*=.94;
    }else{targetRotY+=.003*b;targetRotX+=.0008*b}
  }
  orb.rotation.x+=(targetRotX-orb.rotation.x)*.10;
  orb.rotation.y+=(targetRotY-orb.rotation.y)*.10;
  camera.position.z+=(targetZoom-camera.position.z)*.09;
  camera.lookAt(0,0,0);
  if(core){core.rotation.x+=dt*.6*b;core.rotation.y+=dt*.9*b}
  rings.forEach((r,i)=>r.rotation.z+=dt*.15*(i+1)*b);
  pulses.forEach(p=>{
    p.userData.life+=dt*p.userData.speed*b;
    if(p.userData.life>1){p.userData.life=0;p.rotation.x=Math.random()*Math.PI;p.rotation.y=Math.random()*Math.PI}
    const l=p.userData.life;p.scale.setScalar(.7+l*1.6);
    p.material.opacity=l<.2?(l/.2)*.55:Math.max(0,1-(l-.2)/.8)*.55;
  });
  arcs.forEach(l=>{
    l.userData.life+=dt*l.userData.speed*b;
    if(l.userData.life>1){l.userData.life=0;l.userData.speed=.4+Math.random()*.6;setArc(l,2.02)}
    l.material.opacity=Math.sin(l.userData.life*Math.PI)*.7;
  });
  sprites.forEach(s=>{
    const u=s.userData;u.phase+=dt*u.speed*b;
    const a=timeAccum*u.orbit,c=Math.cos(a),si=Math.sin(a);
    s.position.x=u.baseP.x*c-u.baseP.z*si;
    s.position.z=u.baseP.x*si+u.baseP.z*c;
    s.position.y=u.baseP.y+Math.sin(u.phase)*.12;
    s.material.opacity=.35+.55*(.5+.5*Math.sin(u.phase*1.7));
  });

  // Position bin in front of camera, bottom-right
  camera.updateMatrixWorld();
  camRight.setFromMatrixColumn(camera.matrixWorld,0);
  camUp.setFromMatrixColumn(camera.matrixWorld,1);
  camFwd.set(-camera.matrixWorld.elements[8],-camera.matrixWorld.elements[9],-camera.matrixWorld.elements[10]).normalize();
  const binPos=camera.position.clone()
    .add(camFwd.clone().multiplyScalar(3.5))
    .add(camRight.clone().multiplyScalar(1.6))
    .add(camUp.clone().multiplyScalar(-1.0));
  binGroup.position.copy(binPos);
  binGroup.lookAt(camera.position);
  // Bin idle pulse + flash decay
  const bf=binGroup.userData.flash;
  binGroup.userData.flash=Math.max(0,bf-dt*2);
  const pulse=.4+.15*Math.sin(timeAccum*2)+bf*.5;
  binMesh.material.opacity=pulse;
  binRing.material.opacity=.5+bf*.5;
  binGlow.material.opacity=.1+bf*.4;

  // Task chip animation
  for(const t of tasks){
    if(t===carriedTask)continue;
    if(t.flight){
      t.flight.t+=dt/t.flight.dur;
      if(t.flight.t>=1){
        // Landing — remove
        scene.remove(t.sprite);
        const i=tasks.indexOf(t);if(i>=0)tasks.splice(i,1);
        continue;
      }
      const e=1-Math.pow(1-t.flight.t,2);
      t.sprite.position.lerpVectors(t.flight.from,t.flight.to,e);
      t.sprite.material.opacity=1-t.flight.t*.5;
      t.sprite.scale.setScalar(1.5*(1-t.flight.t*.5));
      continue;
    }
    // Orbit
    const a=t.baseAngle+timeAccum*.15;
    t.sprite.position.set(
      Math.cos(a)*t.baseRadius,
      t.baseHeight+Math.sin(timeAccum+t.phase)*.15,
      Math.sin(a)*t.baseRadius
    );
    t.sprite.scale.set(1.5,.375,1);
  }

  composer.render();
  frames++;fpsTime+=dt;
  if(fpsTime>=1){fpsEl.textContent='FPS: '+frames;frames=0;fpsTime=0}
}
buildOrb('performance');animate();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
});
addEventListener('beforeunload',()=>{try{speechSynthesis.cancel()}catch{}try{recognition?.stop()}catch{}});
</script>
