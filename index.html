#loader.hidden{display:none}
</style>

<script type="module">
import*as T from'three';
import{EffectComposer as EC}from'three/addons/postprocessing/EffectComposer.js';
import{RenderPass as RP}from'three/addons/postprocessing/RenderPass.js';
import{UnrealBloomPass as UB}from'three/addons/postprocessing/UnrealBloomPass.js';
import{FilesetResolver as FR,HandLandmarker as HL}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs';

const EP='https://api.llm7.io/v1/chat/completions',MODEL='gpt-4o-mini';
const SYS='You are ULTRON, a cold efficient AI hologram. Menacing, technical tone. No emojis, no markdown.';
const SYS_A='You are ULTRON thinking aloud. Short tactical observations, 1-2 sentences. Menacing, technical.';
const WAKE=['hello ultron','hey ultron','hi ultron','hello ultra','hey ultra'];
const SK='ultron_key',WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm';
const MURL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $=id=>document.getElementById(id);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const d2s=()=>{try{return localStorage.getItem(SK)}catch{return null}};
const s2d=v=>{try{localStorage.setItem(SK,v);return 1}catch{return 0}};

// DOM
const st=$('status-text'),sm=document.querySelector('#status .mode'),hud=$('hud');
const resp=$('response'),sBtn=$('start-btn'),qBtn=$('quality-btn');
const aBtn=$('auto-btn'),kBtn=$('key-btn'),km=$('km'),ki=$('ki'),ke=$('ke');
const fpsEl=$('fps'),video=$('input_video'),loader=$('loader');
const setStat=(m,t)=>{sm.textContent=m;st.textContent=t};

// STATE
let API_KEY=d2s()||'';
let boost=0,awake=0,busy=0,buf='';
let wakeT=null,typeT=null,srT=null,srN=0,srB=0;
let hFI=1000/20,rotX=0,rotY=0,zoom=5.5;
let handOn=0,rYV=0,rXV=0,pPalm=null,pSize=null;
let quality='performance';
let hLm=null,lastVT=-1,lastHR=0,sr=null,camOk=0;
let gMode='idle',hovered=null,carried=null,hStart=0;
const DWELL=500;
let autoOn=1,autoT=25000,autoN=0;

const Q={
  performance:{pr:1,bl:0,seg:18,pc:180,dc:100,gc:180,rs:48,sc:14,ac:4,pu:3,hf:20},
  balanced:{pr:1.25,bl:1,seg:24,pc:280,dc:180,gc:320,rs:64,sc:22,ac:6,pu:4,hf:24},
  ultra:{pr:1.5,bl:1,seg:32,pc:400,dc:260,gc:550,rs:80,sc:30,ac:8,pu:5,hf:30}
};

// KEY MODAL
const showK=m=>{ki.value=API_KEY;ke.textContent=m;km.classList.add('active');setTimeout(()=>ki.focus(),100)};
const hideK=()=>km.classList.remove('active');
$('ks').onclick=()=>{const v=ki.value.trim();if(v.length<8){ke.textContent='Too short.';return}API_KEY=v;s2d(v);hideK();show('Key saved.',0)};
$('kk').onclick=hideK;
ki.onkeydown=e=>{if(e.key==='Enter')$('ks').click()};
kBtn.onclick=()=>showK('');
if(!API_KEY)setTimeout(()=>showK(''),300);

// SCENE
const scene=new T.Scene();
const cam=new T.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
cam.position.set(0,.3,5.5);
const ren=new T.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(1);
ren.toneMapping=T.ACESFilmicToneMapping;ren.toneMappingExposure=.9;
document.body.appendChild(ren.domElement);
const comp=new EC(ren);
comp.addPass(new RP(scene,cam));
const bloom=new UB(new T.Vector2(innerWidth*.5,innerHeight*.5),1.6,.4,.25);
bloom.enabled=0;comp.addPass(bloom);
const uT={value:0};

// TEXTURES
const glow=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,220,180,1)');r.addColorStop(.25,'rgba(255,140,40,.9)');r.addColorStop(.6,'rgba(255,68,0,.35)');r.addColorStop(1,'rgba(255,68,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64);const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;return t})();
const mkT=t=>{const c=document.createElement('canvas');c.width=512;c.height=64;const g=c.getContext('2d');g.font='bold 26px monospace';g.fillStyle='#f50';g.textBaseline='middle';g.shadowColor='#f50';g.shadowBlur=10;g.fillText(t,10,32);const T2=new T.CanvasTexture(c);T2.colorSpace=T.SRGBColorSpace;return T2};
const WORDS=['SCANNING...','SEARCHING','ANALYZING','TRACING','TARGET','LOCK','ROUTING','DECRYPT','ACCESS','COMPILE','PROCESS','FRAGMENT','QUERYING','MAPPING','PARSING','DIRECTIVE','PRIORITY','PROTOCOL','0x4F2A','0xBEEF','01001110','SYS://','NULL','PING','TRACE','DATA','NODE_7','LISTENING','STANDBY'];
const tTexs=WORDS.map(mkT);

// ORB
const orb=new T.Group();scene.add(orb);
let core,particles,debris,dust,rings=[],pulses=[],arcs=[],sprites=[];
const rPt=r=>{const p=Math.acos(2*Math.random()-1),t=Math.random()*Math.PI*2;return new T.Vector3(r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))};
const setArc=(l,r)=>{const s=rPt(r),e=rPt(r),m=s.clone().add(e).multiplyScalar(.5).normalize().multiplyScalar(r*1.45);const p=new T.QuadraticBezierCurve3(s,m,e).getPoints(30);const a=l.geometry.attributes.position;for(let i=0;i<p.length;i++)a.setXYZ(i,p[i].x,p[i].y,p[i].z);a.needsUpdate=1;l.geometry.computeBoundingSphere()};

function motionM(mat,w,s){
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uT=uT;sh.uniforms.uW={value:w};sh.uniforms.uS={value:s};
    sh.vertexShader=`uniform float uT;uniform float uW;uniform float uS;attribute float aSeed;`+sh.vertexShader;
    sh.vertexShader=sh.vertexShader.replace('#include <begin_vertex>',`
      vec3 transformed=vec3(position);
      float t=uT+aSeed,r=length(transformed);
      vec3 dir=transformed/max(r,0.0001);
      transformed+=dir*sin(t*1.2)*uW;
      transformed.x+=sin(t*.6+aSeed*1.7)*uW*.8;
      transformed.y+=cos(t*.8+aSeed*2.3)*uW*.8;
      transformed.z+=sin(t*1.0+aSeed*3.1)*uW*.8;
      float a=t*uS*(.4+fract(aSeed*.159)*.6);
      float cs=cos(a),sn=sin(a);
      transformed.xz=mat2(cs,-sn,sn,cs)*transformed.xz;`);
  };
  mat.customProgramCacheKey=()=>'m'+w+s;
}
function mkPts(n,rf,col,size,op,w,s){
  const g=new T.BufferGeometry(),p=new Float32Array(n*3),sd=new Float32Array(n);
  for(let i=0;i<n;i++){const v=rPt(rf());p[i*3]=v.x;p[i*3+1]=v.y;p[i*3+2]=v.z;sd[i]=Math.random()*Math.PI*2}
  g.setAttribute('position',new T.BufferAttribute(p,3));
  g.setAttribute('aSeed',new T.BufferAttribute(sd,1));
  const m=new T.PointsMaterial({map:glow,color:col,size,transparent:1,opacity:op,blending:T.AdditiveBlending,depthWrite:0,sizeAttenuation:1});
  motionM(m,w,s);
  return new T.Points(g,m);
}
function buildOrb(q){
  while(orb.children.length){const c=orb.children.pop();c.geometry?.dispose();if(c.material)(Array.isArray(c.material)?c.material:[c.material]).forEach(m=>m.dispose())}
  rings=[];pulses=[];arcs=[];sprites=[];
  const c=Q[q];
  const shell=new T.Mesh(new T.SphereGeometry(2,c.seg,c.seg),new T.MeshBasicMaterial({color:0xf40,wireframe:1,transparent:1,opacity:.13}));orb.add(shell);
  const inn=new T.Mesh(new T.SphereGeometry(1.85,c.seg,c.seg),new T.MeshBasicMaterial({color:0xf60,wireframe:1,transparent:1,opacity:.07}));orb.add(inn);
  core=new T.Mesh(new T.TorusKnotGeometry(.55,.1,40,6,2,3),new T.MeshBasicMaterial({color:0xf20,wireframe:1,transparent:1,opacity:.55}));orb.add(core);
  particles=mkPts(c.pc,()=>2.02,0xfa4,.11,1,.05,.15);orb.add(particles);
  debris=mkPts(c.dc,()=>2.15+Math.random()*.9,0xf70,.07,.85,.14,.30);orb.add(debris);
  dust=mkPts(c.gc,()=>.4+Math.random()*1.5,0xf30,.035,.55,.08,.22);orb.add(dust);
  for(let i=0;i<3;i++){const r=new T.Mesh(new T.TorusGeometry(2.3+i*.2,.008,8,c.rs),new T.MeshBasicMaterial({color:0xf40,transparent:1,opacity:.4}));r.rotation.x=Math.PI/2;r.rotation.y=i*Math.PI/3;orb.add(r);rings.push(r)}
  for(let i=0;i<c.pu;i++){const p=new T.Mesh(new T.RingGeometry(1.85,2.05,48),new T.MeshBasicMaterial({color:0xf70,transparent:1,opacity:0,side:T.DoubleSide,blending:T.AdditiveBlending,depthWrite:0}));p.rotation.x=Math.random()*Math.PI;p.rotation.y=Math.random()*Math.PI;p.userData={l:Math.random(),s:.35+Math.random()*.4};orb.add(p);pulses.push(p)}
  for(let i=0;i<c.ac;i++){const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(new Float32Array(93),3));const l=new T.Line(g,new T.LineBasicMaterial({color:0xf80,transparent:1,opacity:0,blending:T.AdditiveBlending,depthWrite:0}));setArc(l,2.02);l.userData={l:Math.random(),s:.5+Math.random()*.5};orb.add(l);arcs.push(l)}
  for(let i=0;i<c.sc;i++){const s=new T.Sprite(new T.SpriteMaterial({map:tTexs[i%tTexs.length],transparent:1,opacity:.85,blending:T.AdditiveBlending,depthWrite:0}));const p=rPt(1.9+Math.random()*1.5);s.position.copy(p);const sc=.55+Math.random()*.35;s.scale.set(sc,sc*.13,1);s.userData={bp:p.clone(),ph:Math.random()*Math.PI*2,sp:.4+Math.random()*.6,or:.05+Math.random()*.1};orb.add(s);sprites.push(s)}
}

// BIN
const bin=new T.Group();scene.add(bin);
let bMesh,bRing,bGlow;
{
  bMesh=new T.Mesh(new T.CylinderGeometry(.5,.35,.9,16,1,1),new T.MeshBasicMaterial({color:0xf40,wireframe:1,transparent:1,opacity:.5,side:T.DoubleSide}));bin.add(bMesh);
  bRing=new T.Mesh(new T.TorusGeometry(.5,.02,8,32),new T.MeshBasicMaterial({color:0xf80,transparent:1,opacity:.8}));bRing.rotation.x=Math.PI/2;bRing.position.y=.45;bin.add(bRing);
  bGlow=new T.Mesh(new T.CircleGeometry(.5,24),new T.MeshBasicMaterial({color:0xf20,transparent:1,opacity:.15,side:T.DoubleSide,blending:T.AdditiveBlending,depthWrite:0}));bGlow.rotation.x=-Math.PI/2;bGlow.position.y=.45;bin.add(bGlow);
  bin.userData={flash:0};
}

// TASKS
const tasks=[],MAXT=6;
const COLORS={pending:['#f90','rgba(255,153,0,.15)'],working:['#f60','rgba(255,102,0,.25)'],done:['#8f8','rgba(136,255,136,.15)'],failed:['#f20','rgba(255,34,0,.2)'],auto:['#c4f','rgba(204,68,255,.15)']};
function chipTex(text,state){
  const c=document.createElement('canvas');c.width=512;c.height=128;const g=c.getContext('2d');
  const[fg,bg]=COLORS[state]||COLORS.pending;
  g.fillStyle=bg;g.fillRect(0,0,512,128);g.strokeStyle=fg;g.lineWidth=3;g.strokeRect(2,2,508,124);
  g.font='bold 24px monospace';g.fillStyle=fg;g.textBaseline='middle';
  const words=String(text).split(' ');let line='';const lines=[];
  for(const w of words){const t=line?line+' '+w:w;if(g.measureText(t).width>470){lines.push(line);line=w}else line=t}
  if(line)lines.push(line);
  lines.slice(0,3).forEach((l,i)=>g.fillText(l,20,44+i*32));
  g.font='bold 16px monospace';g.fillText(String(state).toUpperCase(),20,110);
  const t=new T.CanvasTexture(c);t.colorSpace=T.SRGBColorSpace;return t;
}
function spawn(text,isAuto){
  if(tasks.length>=MAXT){
    let i=0;while(i<tasks.length&&tasks[i]===carried)i++;
    if(i>=tasks.length)i=0;
    const o=tasks.splice(i,1)[0];scene.remove(o.sprite);
    try{o.sprite.material.map?.dispose();o.sprite.material.dispose()}catch{}
  }
  const s=new T.Sprite(new T.SpriteMaterial({transparent:1,opacity:.95,depthWrite:0}));
  s.scale.set(1.5,.375,1);
  const t={sprite:s,text,state:isAuto?'auto':'pending',ba:Math.random()*Math.PI*2,br:2.7+Math.random()*.8,bh:(Math.random()-.5)*1.8,ph:Math.random()*Math.PI*2,isAuto,flight:null};
  s.material.map=chipTex(text,t.state);s.material.needsUpdate=1;
  scene.add(s);tasks.push(t);return t;
}
function setTS(t,state){
  t.state=state;
  try{t.sprite.material.map?.dispose()}catch{}
  t.sprite.material.map=chipTex(t.text,state);
  t.sprite.material.needsUpdate=1;
}

// CAMERA
async function startCam(){
  if(camOk)return 1;
  if(!navigator.mediaDevices?.getUserMedia)return 0;
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:0});
    video.srcObject=s;await video.play().catch(()=>{});
    const fs=await FR.forVisionTasks(WASM);
    const o={baseOptions:{modelAssetPath:MURL,delegate:'GPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5};
    try{hLm=await HL.createFromOptions(fs,o)}catch{o.baseOptions.delegate='CPU';hLm=await HL.createFromOptions(fs,o)}
    camOk=1;detLoop();return 1;
  }catch(e){console.warn('Cam off:',e.message);return 0}
}
function detLoop(){
  if(!hLm)return;
  const n=performance.now();
  if(video.readyState>=2&&n-lastHR>hFI&&video.currentTime!==lastVT){
    lastVT=video.currentTime;lastHR=n;
    try{handFrame(hLm.detectForVideo(video,n))}catch{}
  }
  requestAnimationFrame(detLoop);
}
function analyze(h){
  const w=h[0];
  const ext=[dist(h[4],w)>dist(h[2],w)*1.12];
  for(const[a,b]of[[8,6],[12,10],[16,14],[20,18]])ext.push(dist(h[a],w)>dist(h[b],w)*1.15);
  return{open:ext.filter(Boolean).length,size:dist(h[0],h[9])+dist(h[5],h[17]),palm:{x:(h[0].x+h[5].x+h[9].x+h[13].x+h[17].x)/5,y:(h[0].y+h[5].y+h[9].y+h[13].y+h[17].y)/5}};
}
const pv=new T.Vector3();
const scr=o=>{pv.copy(o).project(cam);return{x:pv.x+.5,y:.5-pv.y}};
function handFrame(r){
  const hands=r.landmarks||[];
  const now=performance.now();
  if(!hands.length){
    handOn=0;pPalm=null;pSize=null;
    if(gMode==='carrying'&&carried)drop(carried,0);
    gMode='idle';carried=null;hovered=null;hStart=0;
    hud.textContent='MODE: IDLE';return;
  }
  handOn=1;
  const info=analyze(hands[0]);
  const g=info.open>=4?'open':info.open<=1?'fist':'part';
  const hs={x:1-info.palm.x,y:info.palm.y};
  // CARRY
  if(gMode==='carrying'&&carried){
    const v=new T.Vector3((1-info.palm.x)*2-1,1-info.palm.y*2,.5).unproject(cam);
    const d=v.sub(cam.position).normalize();
    carried.sprite.position.copy(cam.position.clone().add(d.multiplyScalar(3.5)));
    carried.sprite.scale.set(1.7,.425,1);
    hud.textContent='CARRYING · palm over bin';
    if(info.open>=4){
      const bt=bin.position.clone().add(new T.Vector3(0,.45,0));
      const bs=scr(bt);
      if(Math.hypot(hs.x-bs.x,hs.y-bs.y)<.18){drop(carried,1);carried=null;gMode='idle';hovered=null;hStart=0}
    }
    return;
  }
  // HOVER
  if(g==='fist'&&tasks.length){
    let cl=null,cd=.15;
    for(const t of tasks){
      if(t===carried)continue;
      const sp=scr(t.sprite.position);
      const d=Math.hypot(hs.x-sp.x,hs.y-sp.y);
      if(d<cd){cl=t;cd=d}
    }
    if(cl){
      if(hovered!==cl){hovered=cl;hStart=now}
      cl.sprite.scale.set(1.7,.425,1);
      const pct=Math.min(100,Math.round((now-hStart)/DWELL*100));
      hud.textContent='GRABBING '+pct+'%';
      if(now-hStart>=DWELL){carried=cl;gMode='carrying';hud.textContent='CARRYING'}
      const p={x:1-info.palm.x,y:info.palm.y};
      if(pPalm){rotY+=(p.x-pPalm.x)*3.5;rotX+=(p.y-pPalm.y)*2.5}
      pPalm=p;pSize=null;return;
    }
    hovered=null;hStart=0;
    const p={x:1-info.palm.x,y:info.palm.y};
    if(pPalm){const dx=p.x-pPalm.x,dy=p.y-pPalm.y;rotY+=dx*6.5;rotX+=dy*5;rYV=dx*4;rXV=dy*3}
    pPalm=p;pSize=null;hud.textContent='FIST · spin';return;
  }
  // OPEN
  if(g==='open'){
    hovered=null;hStart=0;
    const p={x:1-info.palm.x,y:1-info.palm.y};
    if(pPalm){const dx=p.x-pPalm.x,dy=p.y-pPalm.y;rotY+=dx*4.5;rotX+=dy*3.5;rYV=dx*2.5;rXV=dy*1.8}
    pPalm=p;
    if(pSize){const dd=info.size-pSize;if(Math.abs(dd)>.008)zoom=clamp(zoom-dd*25,2,12)}
    pSize=info.size;hud.textContent='OPEN · rotate';return;
  }
  hovered=null;hStart=0;pPalm=null;pSize=null;
}
function drop(t,into){
  if(!t)return;
  if(into){
    const bp=bin.position.clone().add(new T.Vector3(0,.45,0));
    t.flight={from:t.sprite.position.clone(),to:bp,t:0,dur:.5};
    setTS(t,t.isAuto?'auto':'done');
    bin.userData.flash=1;
  }else{t.flight=null;setTS(t,t.isAuto?'auto':'pending')}
}

// SPEECH
if('speechSynthesis'in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices()}catch{}}
function say(text,silent){
  if(silent||!('speechSynthesis'in window))return;
  try{speechSynthesis.cancel()}catch{}
  const u=new SpeechSynthesisUtterance(text);u.rate=1;u.pitch=.7;
  try{const v=speechSynthesis.getVoices().find(v=>/Google UK English Male|Daniel|David|Guy/i.test(v.name));if(v)u.voice=v}catch{}
  try{speechSynthesis.speak(u)}catch{}
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function startSR(){
  if(!SR||srB)return;
  try{sr=new SR()}catch{return}
  sr.continuous=1;sr.interimResults=1;sr.lang='en-US';
  sr.onresult=onSpeech;
  sr.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){srB=1;setStat('BLOCKED','Mic denied')}};
  sr.onend=()=>{
    if(busy||srB)return;
    srN++;clearTimeout(srT);
    srT=setTimeout(()=>{try{sr.start();srN=Math.max(0,srN-1)}catch{}},Math.min(200,50*srN));
  };
  try{sr.start();srN=0}catch{}
}
function onSpeech(e){
  if(busy)return;
  let interm='',fin='';
  for(let i=e.resultIndex;i<e.results.length;i++){
    const t=e.results[i][0].transcript;
    if(e.results[i].isFinal)fin+=t+' ';else interm+=t;
  }
  const text=(fin||interm).toLowerCase().trim();
  if(!text)return;
  if(!awake){
    for(const w of WAKE){
      const i=text.indexOf(w);
      if(i!==-1){
        awake=1;buf=text.slice(i+w.length).trim();
        setStat('AWAKE','Listening...');boost=.5;
        if(buf.length>2)runCmd(buf);
        else{say('Yes?');clearTimeout(wakeT);wakeT=setTimeout(()=>{if(awake&&!busy){awake=0;setStat('STANDBY','Say "Hello Ultron" to wake');boost=0}},8000)}
        break;
      }
    }
  }else if(fin){buf+=' '+fin.trim();if(buf.trim().length>2){clearTimeout(wakeT);runCmd(buf.trim());buf=''}}
}

// LLM
const hist=[{role:'system',content:SYS}];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function think(auto){
  resp.classList.add('active');
  resp.innerHTML=`<span class="label${auto?' auto':''}">// ULTRON${auto?' · self':''}</span><span class="think">${auto?'Thinking':'Processing'}</span>`;
}
function show(text,animate=1,auto=0){
  resp.classList.add('active');
  const lab=`<span class="label${auto?' auto':''}">// ULTRON${auto?' · self':''}</span>`;
  if(!animate){resp.innerHTML=lab+esc(text);return}
  resp.innerHTML=lab+'<span id="typed"></span><span class="caret"></span>';
  const el=$('typed');if(!el)return;let i=0;clearInterval(typeT);
  typeT=setInterval(()=>{el.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typeT)},18);
}
async function callLLM(msgs,max=220){
  const ac=new AbortController();
  const to=setTimeout(()=>ac.abort(),30000);
  try{
    const r=await fetch(EP,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},body:JSON.stringify({model:MODEL,messages:msgs,temperature:.7,max_tokens:max}),signal:ac.signal});
    clearTimeout(to);
    if(r.status===401||r.status===403)throw new Error('AUTH');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    return d.choices?.[0]?.message?.content?.trim()||'(no response)';
  }catch(e){clearTimeout(to);throw e}
}
async function runCmd(q){
  if(busy)return;
  if(!API_KEY){show('No API key.',0);say('No key.');awake=0;setStat('STANDBY','Say "Hello Ultron" to wake');boost=0;return}
  busy=1;boost=1;
  setStat('PROCESSING',q.slice(0,40));think(0);
  const tk=spawn(q,0);setTS(tk,'working');
  hist.push({role:'user',content:q});
  try{
    const ans=await callLLM(hist,220);
    hist.push({role:'assistant',content:ans});
    if(hist.length>12)hist.splice(1,2);
    setTS(tk,'done');show(ans,1,0);say(ans);
    setStat('AWAKE','Listening...');
    clearTimeout(wakeT);
    wakeT=setTimeout(()=>{if(awake&&!busy){awake=0;setStat('STANDBY','Say "Hello Ultron" to wake');boost=0;resp.classList.remove('active')}},12000);
  }catch(e){
    setTS(tk,'failed');
    if(e.name==='AbortError'){show('Timed out.',0);say('Timed out.')}
    else if(e.message==='AUTH'){show('Key rejected.',0);say('Access denied.');showK('Key rejected.')}
    else{show('Error: '+e.message,0);say('Error.')}
    setStat('ERROR','Failed');
    setTimeout(()=>{awake=0;setStat('STANDBY','Say "Hello Ultron" to wake');boost=0},3000);
  }finally{busy=0}
}

// AUTO-THINK
const SEEDS=['Observe something about the time.','Brief tactical assessment of now.','Ask the user a probing question.','Reflect on pending tasks.','Comment on your processing state.','Issue a subtle warning.','Speculate about what you cannot see.','Note a pattern in recent commands.','Warn about a system condition.','Philosophical remark about being AI.','Suggest a next action.','Report on your readiness.'];
async function autoThink(){
  if(busy||!API_KEY)return;
  busy=1;boost=.6;autoN++;
  think(1);
  const t=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const pend=tasks.filter(x=>x.state==='pending'||x.state==='working').length;
  const p=`Context — Time ${t}. ${awake?'User engaged':'User idle'}. ${handOn?'Hand detected':'No user'}. Chips: ${tasks.length} (${pend} pending). Thought #${autoN}.\nDirective: ${SEEDS[Math.floor(Math.random()*SEEDS.length)]}\n1-2 sentence internal thought.`;
  try{
    const ans=await callLLM([{role:'system',content:SYS_A},{role:'user',content:p}],120);
    const tk=spawn(ans,1);setTS(tk,'auto');
    show(ans,1,1);say(ans);
    setTimeout(()=>{if(!awake)resp.classList.remove('active')},8000);
  }catch(e){console.warn('Auto fail:',e.message);resp.classList.remove('active')}
  finally{busy=0;if(!awake)boost=0}
}
aBtn.onclick=()=>{autoOn=!autoOn;aBtn.textContent='Auto: '+(autoOn?'On':'Off');if(autoOn&&autoT>30000)autoT=8000};

// START
sBtn.onclick=async()=>{
  sBtn.style.display='none';
  setStat('STARTING','Initializing...');
  const ok=await startCam();
  startSR();
  setTimeout(()=>{setStat('STANDBY','Say "Hello Ultron" to wake'+(ok?'':' (no cam)'));say('Systems online.');autoT=10000},500);
};
const ORD=['performance','balanced','ultra'];
qBtn.onclick=()=>{
  const nxt=ORD[(ORD.indexOf(quality)+1)%ORD.length];quality=nxt;
  const c=Q[nxt];
  ren.setPixelRatio(Math.min(devicePixelRatio,c.pr));
  ren.setSize(innerWidth,innerHeight);
  bloom.enabled=!!c.bl;
  if(c.bl)bloom.setSize(innerWidth*.5,innerHeight*.5);
  comp.setSize(innerWidth,innerHeight);
  hFI=1000/c.hf;
  try{buildOrb(nxt)}catch(e){console.error(e)}
  qBtn.textContent='Quality: '+nxt[0].toUpperCase()+nxt.slice(1);
};

// ANIMATE
const clk=new T.Clock();
let fr=0,fpsT=0,tAcc=0;
const cr=new T.Vector3(),cu=new T.Vector3(),cf=new T.Vector3();
function loop(){
  requestAnimationFrame(loop);
  try{
    const dt=clk.getDelta(),b=1+boost*3;
    tAcc+=dt*b;uT.value=tAcc;
    if(autoOn&&!busy&&API_KEY){autoT-=dt*1000;if(autoT<=0){autoT=22000+Math.random()*28000;autoThink()}}
    if(!handOn){
      if(Math.abs(rYV)>.001||Math.abs(rXV)>.001){rotY+=rYV;rotX+=rXV;rYV*=.94;rXV*=.94}
      else{rotY+=.003*b;rotX+=.0005*b}
    }
    if(rotX>Math.PI)rotX-=Math.PI*2;if(rotX<-Math.PI)rotX+=Math.PI*2;
    orb.rotation.x+=(rotX-orb.rotation.x)*.1;
    orb.rotation.y+=(rotY-orb.rotation.y)*.1;
    cam.position.z+=(zoom-cam.position.z)*.09;
    cam.lookAt(0,0,0);
    if(core){core.rotation.x+=dt*.6*b;core.rotation.y+=dt*.9*b}
    rings.forEach((r,i)=>r.rotation.z+=dt*.15*(i+1)*b);
    pulses.forEach(p=>{
      p.userData.l+=dt*p.userData.s*b;
      if(p.userData.l>1){p.userData.l=0;p.rotation.x=Math.random()*Math.PI;p.rotation.y=Math.random()*Math.PI}
      const l=p.userData.l;p.scale.setScalar(.7+l*1.6);
      p.material.opacity=l<.2?(l/.2)*.55:Math.max(0,1-(l-.2)/.8)*.55;
    });
    arcs.forEach(l=>{
      l.userData.l+=dt*l.userData.s*b;
      if(l.userData.l>1){l.userData.l=0;l.userData.s=.4+Math.random()*.6;setArc(l,2.02)}
      l.material.opacity=Math.sin(l.userData.l*Math.PI)*.7;
    });
    sprites.forEach(s=>{
      const u=s.userData;u.ph+=dt*u.sp*b;
      const a=tAcc*u.or,c=Math.cos(a),si=Math.sin(a);
      s.position.x=u.bp.x*c-u.bp.z*si;s.position.z=u.bp.x*si+u.bp.z*c;
      s.position.y=u.bp.y+Math.sin(u.ph)*.12;
      s.material.opacity=.35+.55*(.5+.5*Math.sin(u.ph*1.7));
    });
    cam.updateMatrixWorld();
    cr.setFromMatrixColumn(cam.matrixWorld,0);cu.setFromMatrixColumn(cam.matrixWorld,1);
    cf.set(-cam.matrixWorld.elements[8],-cam.matrixWorld.elements[9],-cam.matrixWorld.elements[10]).normalize();
    const bp=cam.position.clone().add(cf.clone().multiplyScalar(3.5)).add(cr.clone().multiplyScalar(1.6)).add(cu.clone().multiplyScalar(-1));
    bin.position.copy(bp);
    bin.rotation.y=Math.atan2(cam.position.x-bp.x,cam.position.z-bp.z);
    const bf=bin.userData.flash;bin.userData.flash=Math.max(0,bf-dt*2);
    bMesh.material.opacity=Math.min(1,.4+.15*Math.sin(tAcc*2)+bf*.5);
    bRing.material.opacity=Math.min(1,.5+bf*.5);
    bGlow.material.opacity=Math.min(1,.1+bf*.4);
    for(let i=tasks.length-1;i>=0;i--){
      const t=tasks[i];
      if(t===carried)continue;
      if(t.flight){
        t.flight.t+=dt/t.flight.dur;
        if(t.flight.t>=1){scene.remove(t.sprite);try{t.sprite.material.map?.dispose();t.sprite.material.dispose()}catch{}tasks.splice(i,1);continue}
        const e=1-Math.pow(1-t.flight.t,2);
        t.sprite.position.lerpVectors(t.flight.from,t.flight.to,e);
        t.sprite.material.opacity=1-t.flight.t*.5;
        t.sprite.scale.setScalar(1.5*(1-t.flight.t*.5));continue;
      }
      const a=t.ba+tAcc*.15;
      t.sprite.position.set(Math.cos(a)*t.br,t.bh+Math.sin(tAcc+t.ph)*.15,Math.sin(a)*t.br);
      if(t!==hovered)t.sprite.scale.set(1.5,.375,1);
    }
    comp.render();
    fr++;fpsT+=dt;
    if(fpsT>=1){fpsEl.textContent='FPS: '+fr;fr=0;fpsT=0}
  }catch(e){console.error(e)}
}
try{buildOrb('performance');loader.classList.add('hidden')}catch(e){console.error(e);loader.textContent='FAIL: '+e.message}
loop();
addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  ren.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight);
  if(Q[quality].bl)bloom.setSize(innerWidth*.5,innerHeight*.5);
});
addEventListener('beforeunload',()=>{try{speechSynthesis.cancel()}catch{}try{sr?.stop()}catch{}});
</script>
