<!DOCTYPE html>

<title>Ultron AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#000;font-family:system-ui,sans-serif;color:#0df}
.u{position:fixed;background:rgba(0,8,16,.78);border:1px solid rgba(0,221,255,.4);border-radius:8px;padding:8px 14px;font:12px 'Courier New',monospace;text-shadow:0 0 6px #0df;z-index:10;color:#0df}
#info{top:15px;left:15px;font-size:11px;line-height:1.5;pointer-events:none;max-width:230px}
#quality-btn{top:15px;right:15px;cursor:pointer}
#auto-btn{top:15px;right:170px;cursor:pointer}
#key-btn{top:15px;right:90px;cursor:pointer}
#fps{bottom:20px;left:20px;color:#0f9}
#hud{bottom:60px;left:20px;color:#6ef;min-width:200px}
#status{bottom:20px;left:50%;transform:translateX(-50%);text-align:center;min-width:260px;padding:12px 22px;font-size:14px}
#status .mode{color:#6ef;font-size:11px;letter-spacing:2px;display:block;margin-bottom:4px}
#start-btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;padding:14px 28px;font:17px 'Courier New',monospace;background:transparent;color:#0df;border:2px solid #0df;border-radius:8px;cursor:pointer;text-shadow:0 0 10px #0df;box-shadow:0 0 20px rgba(0,221,255,.3)}
#start-btn:hover{background:rgba(0,221,255,.15)}
#video-container{position:fixed;bottom:20px;right:20px;width:200px;height:150px;border:1px solid #0df;border-radius:8px;overflow:hidden;z-index:10;opacity:.85;box-shadow:0 0 20px rgba(0,221,255,.3);background:#000}
#input_video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#response{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:15;width:min(700px,calc(100% - 40px));max-height:40vh;overflow-y:auto;background:rgba(0,8,16,.82);color:#9ef;border:1px solid rgba(0,221,255,.5);border-radius:10px;padding:16px 20px;font:14px/1.6 'Courier New',monospace;text-shadow:0 0 6px rgba(0,221,255,.7);opacity:0;pointer-events:none;transition:opacity .35s;white-space:pre-wrap}
#response.active{opacity:1}
#response .label{display:block;color:#0df;font-size:11px;letter-spacing:2px;margin-bottom:6px}

#km{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center}

#kb{width:min(480px,calc(100% - 40px));background:rgba(0,8,16,.95);border:1px solid rgba(0,221,255,.6);border-radius:12px;padding:24px 28px;font-family:'Courier New',monospace;color:#9ef;box-shadow:0 0 60px rgba(0,221,255,.4)}
#kb h2{margin:0 0 8px;font-size:16px;color:#0df;letter-spacing:3px;text-transform:uppercase}
#kb p{font-size:12px;color:#6ef;margin:0 0 16px;line-height:1.5}
#ki{width:100%;padding:12px 14px;font:14px 'Courier New',monospace;background:rgba(0,0,0,.8);color:#cff;border:1px solid #0df;border-radius:8px;outline:none}
#ke{color:#f36;font-size:12px;margin-top:8px;min-height:16px}
#ka{display:flex;gap:8px;margin-top:16px}
#ka button{flex:1;padding:10px 14px;font:12px 'Courier New',monospace;font-weight:bold;background:rgba(0,221,255,.15);color:#0df;border:1px solid #0df;border-radius:6px;cursor:pointer;letter-spacing:2px;text-transform:uppercase}
#ka button:hover{background:rgba(0,221,255,.35)}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#0df;font:14px 'Courier New',monospace;z-index:50;padding:20px;text-align:center}
#loader.hidden{display:none}
#errbox{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:60;background:rgba(20,0,0,.95);color:#f36;border:1px solid #f36;padding:20px;font:12px 'Courier New',monospace;max-width:600px;display:none;white-space:pre-wrap}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {FilesetResolver,HandLandmarker} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs';

// ---------- PALETTE (mixed orange + cyan tech) ----------
const PAL = {
  or:  0xff4400, ol: 0xff8800, od: 0xff2200, ow: 0xffaa66,
  cy:  0x00ddff, cl: 0x66eeff, cd: 0x0088cc, cw: 0xbbffff,
  tl:  0x00ffaa, pu: 0xaa44ff, wh: 0xffffff
};

const ENDPOINT = 'https://api.llm7.io/v1/chat/completions';
const MODEL_CANDIDATES = ['default','gpt-4o-mini','gpt-4o','gpt-3.5-turbo','deepseek-chat','mistral-small'];
let workingModel = 'default';
const SYS = 'You are ULTRON, a cold efficient AI hologram. Menacing, technical tone. No emojis, no markdown.';
const SYS_A = 'You are ULTRON thinking aloud. 1-2 sentence tactical observations. Menacing, technical.';
const WAKE = ['hello ultron','hey ultron','hi ultron','hello ultra','hey ultra'];
const SK = 'ultron_key';
const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm';
const MURL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';

const $ = id => document.getElementById(id);
const d2 = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const getK = () => { try { return localStorage.getItem(SK); } catch { return null; } };
const setK = v => { try { localStorage.setItem(SK, v); return 1; } catch { return 0; } };
const err = m => { const e=$('errbox'); e.textContent=m; e.style.display='block'; };

// ---------- DOM ----------
const stxt = $('status-text'), smode = document.querySelector('#status .mode');
const hud = $('hud'), resp = $('response'), sBtn = $('start-btn');
const qBtn = $('quality-btn'), aBtn = $('auto-btn'), kBtn = $('key-btn');
const km = $('km'), ki = $('ki'), ke = $('ke'), fpsEl = $('fps');
const vid = $('input_video'), ldr = $('loader');
const setS = (m,t) => { smode.textContent=m; stxt.textContent=t; };

// ---------- STATE ----------
let KEY = getK() || '';
let boost = 0, awake = 0, busy = 0, buf = '';
let wakeT = null, typT = null, srT = null, srN = 0, srB = 0;
let hFI = 1000/20, rotX = 0, rotY = 0, zoom = 5.5;
let handOn = 0, rYV = 0, rXV = 0, pPalm = null, pSize = null;
let quality = 'performance';
let hLM = null, lastVT = -1, lastHR = 0, sr = null, camOk = 0;
let gMode = 'idle', hovered = null, carried = null, hStart = 0;
const DWELL = 300; // snappier grab
let autoOn = 1, autoT = 25000, autoN = 0;

const Q = {
  performance: { pr:1,    bl:0, seg:18, pc:180, dc:100, gc:180, rs:48, sc:16, ac:6, pu:4, hf:20 },
  balanced:    { pr:1.25, bl:1, seg:24, pc:280, dc:180, gc:320, rs:64, sc:24, ac:8, pu:5, hf:24 },
  ultra:       { pr:1.5,  bl:1, seg:32, pc:400, dc:260, gc:550, rs:80, sc:32, ac:10, pu:6, hf:30 }
};

// ---------- KEY MODAL ----------
const showK = m => { ki.value=KEY; ke.textContent=m; km.classList.add('active'); setTimeout(()=>{try{ki.focus()}catch{}},100); };
const hideK = () => km.classList.remove('active');
$('ks').onclick = () => { const v = ki.value.trim(); if (v.length<8){ke.textContent='Too short.';return;} KEY=v; setK(v); hideK(); show('Key saved.',0); };
$('kk').onclick = hideK;
ki.addEventListener('keydown', e => { if (e.key==='Enter') $('ks').click(); });
kBtn.onclick = () => showK('');
if (!KEY) setTimeout(()=>showK(''),300);

// ---------- SCENE ----------
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .1, 500);
cam.position.set(0,.3,5.5);
const ren = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
ren.setSize(innerWidth,innerHeight); ren.setPixelRatio(1);
ren.toneMapping = THREE.ACESFilmicToneMapping; ren.toneMappingExposure = .9;
document.body.appendChild(ren.domElement);
const comp = new EffectComposer(ren);
comp.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth*.5, innerHeight*.5), 1.6, .4, .25);
bloom.enabled = false; comp.addPass(bloom);
const uT = { value: 0 };

// ---------- TEXTURES ----------
const glow = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const r = g.createRadialGradient(32,32,0,32,32,32);
  r.addColorStop(0, 'rgba(255,255,255,1)');
  r.addColorStop(.35, 'rgba(255,255,255,.55)');
  r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0,0,64,64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const mkT = (txt, hex) => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 24px monospace';
  g.fillStyle = hex;
  g.textBaseline = 'middle';
  g.shadowColor = hex; g.shadowBlur = 12;
  g.fillText(txt, 10, 32);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
};
const WORDS = ['SCANNING','SEARCHING','ANALYZING','TRACING','TARGET','LOCK','ROUTING','DECRYPT','ACCESS','COMPILE','PROCESS','FRAGMENT','QUERYING','MAPPING','PARSING','DIRECTIVE','PRIORITY','PROTOCOL','0x4F2A','0xBEEF','01001110','SYS://','NULL','PING','TRACE','DATA','NODE_7','LISTENING','STANDBY'];
const wordTexs = WORDS.map((w,i) => mkT(w, i % 2 === 0 ? '#00ddff' : '#ff8800'));

// ---------- ORB ----------
const orb = new THREE.Group(); scene.add(orb);
let core, parts, debris, dust, rings = [], pulses = [], arcs = [], sprites = [];

const rPt = r => {
  const p = Math.acos(2*Math.random()-1), t = Math.random()*Math.PI*2;
  return new THREE.Vector3(r*Math.sin(p)*Math.cos(t), r*Math.cos(p), r*Math.sin(p)*Math.sin(t));
};
const setArc = (l, r) => {
  const s = rPt(r), e = rPt(r);
  const m = s.clone().add(e).multiplyScalar(.5).normalize().multiplyScalar(r*1.45);
  const pts = new THREE.QuadraticBezierCurve3(s, m, e).getPoints(30);
  const pos = l.geometry.attributes.position;
  for (let i = 0; i < pts.length; i++) pos.setXYZ(i, pts[i].x, pts[i].y, pts[i].z);
  pos.needsUpdate = 1; l.geometry.computeBoundingSphere();
};

function motionM(mat, w, s) {
  mat.onBeforeCompile = sh => {
    sh.uniforms.uT = uT; sh.uniforms.uW = { value: w }; sh.uniforms.uS = { value: s };
    sh.vertexShader = `uniform float uT;uniform float uW;uniform float uS;attribute float aSeed;` + sh.vertexShader;
    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `
      vec3 transformed=vec3(position);
      float t=uT+aSeed,r=length(transformed);
      vec3 dir=transformed/max(r,0.0001);
      transformed+=dir*sin(t*1.2)*uW;
      transformed.x+=sin(t*0.6+aSeed*1.7)*uW*0.8;
      transformed.y+=cos(t*0.8+aSeed*2.3)*uW*0.8;
      transformed.z+=sin(t*1.0+aSeed*3.1)*uW*0.8;
      float a=t*uS*(0.4+fract(aSeed*0.159)*0.6);
      float cs=cos(a),sn=sin(a);
      transformed.xz=mat2(cs,-sn,sn,cs)*transformed.xz;
    `);
  };
  mat.customProgramCacheKey = () => 'm'+w+s;
}

function mkPts(n, rf, colors, size, op, w, s) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n*3);
  const seeds = new Float32Array(n);
  const cols = new Float32Array(n*3);
  const multi = Array.isArray(colors);
  const tmp = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const v = rPt(rf());
    pos[i*3]=v.x; pos[i*3+1]=v.y; pos[i*3+2]=v.z;
    seeds[i] = Math.random()*Math.PI*2;
    tmp.setHex(multi ? colors[i % colors.length] : colors);
    cols[i*3]=tmp.r; cols[i*3+1]=tmp.g; cols[i*3+2]=tmp.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seeds, 1));
  geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  const mat = new THREE.PointsMaterial({
    map: glow, size, transparent: 1, opacity: op,
    vertexColors: 1, blending: THREE.AdditiveBlending,
    depthWrite: 0, sizeAttenuation: 1
  });
  motionM(mat, w, s);
  return new THREE.Points(geo, mat);
}

function buildOrb(q) {
  while (orb.children.length) {
    const c = orb.children.pop();
    c.geometry?.dispose();
    if (c.material) (Array.isArray(c.material)?c.material:[c.material]).forEach(m => m.dispose());
  }
  rings=[]; pulses=[]; arcs=[]; sprites=[];
  const c = Q[q];

  // Dual wireframe shells — cyan outer, orange inner
  orb.add(new THREE.Mesh(
    new THREE.SphereGeometry(2, c.seg, c.seg),
    new THREE.MeshBasicMaterial({ color: PAL.cy, wireframe: 1, transparent: 1, opacity: .10 })
  ));
  orb.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.85, c.seg, c.seg),
    new THREE.MeshBasicMaterial({ color: PAL.ol, wireframe: 1, transparent: 1, opacity: .08 })
  ));

  // Core — dual torus knots
  core = new THREE.Group();
  const ck1 = new THREE.Mesh(
    new THREE.TorusKnotGeometry(.55, .1, 40, 6, 2, 3),
    new THREE.MeshBasicMaterial({ color: PAL.od, wireframe: 1, transparent: 1, opacity: .55 })
  );
  const ck2 = new THREE.Mesh(
    new THREE.TorusKnotGeometry(.75, .04, 48, 8, 3, 5),
    new THREE.MeshBasicMaterial({ color: PAL.cl, wireframe: 1, transparent: 1, opacity: .35 })
  );
  core.add(ck1, ck2);
  orb.add(core);

  // Particles with mixed colors
  parts = mkPts(c.pc, () => 2.02, [PAL.ol, PAL.cy, PAL.ow, PAL.cl, PAL.wh], .11, 1, .05, .15); orb.add(parts);
  debris = mkPts(c.dc, () => 2.15 + Math.random()*.9, [PAL.cy, PAL.cl, PAL.tl], .07, .85, .14, .30); orb.add(debris);
  dust = mkPts(c.gc, () => .4 + Math.random()*1.5, [PAL.od, PAL.or, PAL.pu], .035, .55, .08, .22); orb.add(dust);

  // 6 orbital rings — alternating cyan/orange
  const rcfgs = [
    { r:2.25, t:.008, rx:Math.PI/2,  ry:0,              spd: .15, col:PAL.cy },
    { r:2.50, t:.006, rx:Math.PI/2,  ry:Math.PI/3,      spd:-.12, col:PAL.ol },
    { r:2.75, t:.010, rx:Math.PI/2,  ry:2*Math.PI/3,    spd: .20, col:PAL.cy },
    { r:2.40, t:.007, rx:Math.PI/3,  ry:Math.PI/4,      spd:-.18, col:PAL.ol },
    { r:2.60, t:.005, rx:-Math.PI/3, ry:Math.PI/6,      spd: .10, col:PAL.cl },
    { r:2.85, t:.009, rx:Math.PI/4,  ry:-Math.PI/4,     spd:-.14, col:PAL.or }
  ];
  rcfgs.forEach((rc,i) => {
    const r = new THREE.Mesh(
      new THREE.TorusGeometry(rc.r, rc.t, 6, c.rs),
      new THREE.MeshBasicMaterial({ color: rc.col, transparent: 1, opacity: .4 - i*.02 })
    );
    r.rotation.x = rc.rx; r.rotation.y = rc.ry;
    r.userData.spd = rc.spd;
    orb.add(r); rings.push(r);
  });

  // Pulses — alternating colors
  for (let i = 0; i < c.pu; i++) {
    const p = new THREE.Mesh(
      new THREE.RingGeometry(1.85, 2.05, 48),
      new THREE.MeshBasicMaterial({
        color: i % 2 === 0 ? PAL.cy : PAL.ol,
        transparent: 1, opacity: 0, side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending, depthWrite: 0
      })
    );
    p.rotation.x = Math.random()*Math.PI; p.rotation.y = Math.random()*Math.PI;
    p.userData = { life: Math.random(), spd: .35 + Math.random()*.4 };
    orb.add(p); pulses.push(p);
  }

  // Arcs — mixed colors
  for (let i = 0; i < c.ac; i++) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(93), 3));
    const l = new THREE.Line(g, new THREE.LineBasicMaterial({
      color: i % 2 === 0 ? PAL.cl : PAL.ol,
      transparent: 1, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: 0
    }));
    setArc(l, 2.02);
    l.userData = { life: Math.random(), spd: .5 + Math.random()*.5 };
    orb.add(l); arcs.push(l);
  }

  // Text sprites — cyan-dominant
  for (let i = 0; i < c.sc; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: wordTexs[i % wordTexs.length],
      transparent: 1, opacity: .85,
      blending: THREE.AdditiveBlending, depthWrite: 0
    }));
    const p = rPt(1.9 + Math.random()*1.5);
    s.position.copy(p);
    const sc = .55 + Math.random()*.35;
    s.scale.set(sc, sc*.13, 1);
    s.userData = { bp: p.clone(), ph: Math.random()*Math.PI*2, spd: .4 + Math.random()*.6, orb: .05 + Math.random()*.1 };
    orb.add(s); sprites.push(s);
  }
}

// ---------- PORTAL (complex mechanical ring with hole at center) ----------
const portal = new THREE.Group();
portal.scale.setScalar(.85);
scene.add(portal);
const P = {};
{
  // Outer wireframe torus (orange, structural frame)
  P.outer = new THREE.Mesh(
    new THREE.TorusGeometry(.95, .05, 8, 48),
    new THREE.MeshBasicMaterial({ color: PAL.or, wireframe: 1, transparent: 1, opacity: .35 })
  );
  portal.add(P.outer);

  // Mid cyan smooth ring
  P.mid = new THREE.Mesh(
    new THREE.TorusGeometry(.78, .028, 8, 64),
    new THREE.MeshBasicMaterial({ color: PAL.cy, transparent: 1, opacity: .85 })
  );
  portal.add(P.mid);

  // Inner orange ring
  P.inner = new THREE.Mesh(
    new THREE.TorusGeometry(.58, .018, 8, 48),
    new THREE.MeshBasicMaterial({ color: PAL.ol, transparent: 1, opacity: .9 })
  );
  portal.add(P.inner);

  // Innermost glow ring (edge of the hole)
  P.edge = new THREE.Mesh(
    new THREE.RingGeometry(.28, .42, 48),
    new THREE.MeshBasicMaterial({
      color: PAL.cl, transparent: 1, opacity: .55,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: 0
    })
  );
  portal.add(P.edge);

  // The hole (dark center)
  P.hole = new THREE.Mesh(
    new THREE.CircleGeometry(.28, 32),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: 1, opacity: .92, side: THREE.DoubleSide })
  );
  portal.add(P.hole);

  // Cyan halo around hole
  P.halo = new THREE.Mesh(
    new THREE.CircleGeometry(.32, 32),
    new THREE.MeshBasicMaterial({
      color: PAL.cy, transparent: 1, opacity: .3,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: 0
    })
  );
  portal.add(P.halo);

  // 8 satellites orbiting the portal
  P.sats = [];
  for (let i = 0; i < 8; i++) {
    const s = new THREE.Mesh(
      new THREE.BoxGeometry(.06,.06,.06),
      new THREE.MeshBasicMaterial({ color: i%2 === 0 ? PAL.cy : PAL.ol, transparent: 1, opacity: .9 })
    );
    s.userData = { angle: (i/8)*Math.PI*2, rad: 1.15, spd: .6 + Math.random()*.4 };
    portal.add(s); P.sats.push(s);
  }

  // 4 cross struts
  P.struts = [];
  for (let i = 0; i < 4; i++) {
    const s = new THREE.Mesh(
      new THREE.BoxGeometry(.018, 1.9, .018),
      new THREE.MeshBasicMaterial({ color: PAL.cd, transparent: 1, opacity: .5 })
    );
    s.rotation.z = (i/4)*Math.PI;
    portal.add(s); P.struts.push(s);
  }

  // Small marker ring at the top (target indicator)
  P.marker = new THREE.Mesh(
    new THREE.TorusGeometry(.08, .012, 6, 16),
    new THREE.MeshBasicMaterial({ color: PAL.tl, transparent: 1, opacity: .9 })
  );
  P.marker.position.y = 1.15;
  portal.add(P.marker);

  portal.userData = { flash: 0 };
}

// ---------- TASK CHIPS ----------
const tasks = [], MAXT = 6;
const CCOL = {

  done:    ['#88ffcc','rgba(136,255,204,.15)'],

  }

  }

    sprite: s, text, state: isAuto ? 'auto' : 'pending',
    ba: Math.random()*Math.PI*2, br: 2.7 + Math.random()*.8,
    bh: (Math.random()-.5)*1.8, ph: Math.random()*Math.PI*2,

}

function detLoop() {

function analyze(h) {
  const w = h[0];
  const ext = [d2(h[4],w) > d2(h[2],w)*1.12];
  for (const [t,p] of [[8,6],[12,10],[16,14],[20,18]]) ext.push(d2(h[t],w) > d2(h[p],w)*1.15);
  return {
    open: ext.filter(Boolean).length,
    size: d2(h[0],h[9]) + d2(h[5],h[17]),
    palm: { x:(h[0].x+h[5].x+h[9].x+h[13].x+h[17].x)/5, y:(h[0].y+h[5].y+h[9].y+h[13].y+h[17].y)/5 }

}
const pv = new THREE.Vector3();
const scrPos = o => { pv.copy(o).project(cam); return { x: pv.x + .5, y: .5 - pv.y }; };

function doHands(r) {
  const hands = r.landmarks || [];
  const now = performance.now();
  if (!hands.length) {
    // ---------- HAND LOST → keep momentum ----------
    handOn = 0; pPalm = null; pSize = null;
    if (gMode === 'carrying' && carried) drop(carried, 0);
    gMode = 'idle'; carried = null; hovered = null; hStart = 0;
    hud.textContent = 'MODE: IDLE';
    // Boost momentum for a "thrown" feel

    return;
  }
  handOn = 1;
  const info = analyze(hands[0]);
  const g = info.open >= 4 ? 'open' : info.open <= 1 ? 'fist' : 'part';
  const hs = { x: 1 - info.palm.x, y: info.palm.y };

  // ---------- CARRYING ----------
  if (gMode === 'carrying' && carried) {
    const v = new THREE.Vector3((1-info.palm.x)*2-1, 1-info.palm.y*2, .5).unproject(cam);
    const d = v.sub(cam.position).normalize();
    carried.sprite.position.copy(cam.position.clone().add(d.multiplyScalar(3.2)));
    carried.sprite.scale.set(1.7,.425,1);
    hud.textContent = 'CARRYING · palm over portal';
    // Wider catch radius
    if (info.open >= 4) {
      const portalCenter = portal.position.clone();
      const ps = scrPos(portalCenter);
      if (Math.hypot(hs.x - ps.x, hs.y - ps.y) < .28) {
        drop(carried, 1); carried = null; gMode = 'idle'; hovered = null; hStart = 0;
      }

  }

  // ---------- FIST → GRAB or SPIN ----------
  if (g === 'fist' && tasks.length) {
    let cl = null, cd = .22; // wider grab range
    for (const t of tasks) {
      if (t === carried) continue;
      const sp = scrPos(t.sprite.position);
      const d = Math.hypot(hs.x - sp.x, hs.y - sp.y);
      if (d < cd) { cl = t; cd = d; }
    }
    if (cl) {
      if (hovered !== cl) { hovered = cl; hStart = now; }
      cl.sprite.scale.set(1.7,.425,1);
      const pct = Math.min(100, Math.round((now - hStart) / DWELL * 100));
      hud.textContent = 'GRAB ' + pct + '%';
      if (now - hStart >= DWELL) { carried = cl; gMode = 'carrying'; hud.textContent = 'CARRYING · palm over portal'; }
      // Rotate while hovering
      const p = { x: 1 - info.palm.x, y: info.palm.y };
      if (pPalm) {
        const dx = p.x - pPalm.x, dy = p.y - pPalm.y;
        rotY += dx * 3.5; rotX += dy * 2.5;
        rYV = dx * 8; rXV = dy * 6;
      }
      pPalm = p; pSize = null; return;
    }
    hovered = null; hStart = 0;
    const p = { x: 1 - info.palm.x, y: info.palm.y };
    if (pPalm) {
      const dx = p.x - pPalm.x, dy = p.y - pPalm.y;
      rotY += dx * 6.5; rotX += dy * 5;
      rYV = dx * 15; rXV = dy * 12;
    }
    pPalm = p; pSize = null;
    hud.textContent = 'FIST · spin';
    return;
  }

  // ---------- OPEN PALM → ROTATE + ZOOM ----------
  if (g === 'open') {
    hovered = null; hStart = 0;
    const p = { x: 1 - info.palm.x, y: 1 - info.palm.y };
    if (pPalm) {
      const dx = p.x - pPalm.x, dy = p.y - pPalm.y;

      rYV = dx * 12; rXV = dy * 10;
    }
    pPalm = p;
    if (pSize) {
      const dd = info.size - pSize;
      if (Math.abs(dd) > .008) zoom = clamp(zoom - dd*25, 2, 12);
    }
    pSize = info.size;
    hud.textContent = 'OPEN · rotate';
    return;
  }

  hovered = null; hStart = 0; pPalm = null; pSize = null;
}

function drop(t, into) {
  if (!t) return;
  if (into) {
    // Fly to portal center (the hole)
    const bp = portal.position.clone();
    t.flight = { from: t.sprite.position.clone(), to: bp, t: 0, dur: .55 };
    setTS(t, t.isAuto ? 'auto' : 'done');

    t.flight = null;

}

async function callLLM(msgs, max = 220) {

// ---------- ANIMATE ----------
const clk = new THREE.Clock();
let fr = 0, fpsT = 0, tAcc = 0;
const camR = new THREE.Vector3(), camU = new THREE.Vector3(), camF = new THREE.Vector3();
function loop() {
  requestAnimationFrame(loop);
  try {
    const dt = clk.getDelta(), b = 1 + boost * 3;
    tAcc += dt * b; uT.value = tAcc;

    if (autoOn && !busy && KEY) {
      autoT -= dt * 1000;
      if (autoT <= 0) { autoT = 22000 + Math.random()*28000; autoThink(); }
    }

    // Momentum / auto-rotate
    if (!handOn) {
      if (Math.abs(rYV) > .0005 || Math.abs(rXV) > .0005) {
        rotY += rYV; rotX += rXV;
        rYV *= .97; rXV *= .97;
      } else {
        rotY += .003 * b; rotX += .0005 * b;
      }
    }
    if (rotX > Math.PI) rotX -= Math.PI*2;
    if (rotX < -Math.PI) rotX += Math.PI*2;

    orb.rotation.x += (rotX - orb.rotation.x) * .1;
    orb.rotation.y += (rotY - orb.rotation.y) * .1;
    cam.position.z += (zoom - cam.position.z) * .09;
    cam.lookAt(0,0,0);

    if (core) {
      core.rotation.x += dt * .6 * b;
      core.rotation.y += dt * .9 * b;
      core.children[1].rotation.x -= dt * .4 * b;
      core.children[1].rotation.z += dt * .7 * b;
    }
    rings.forEach(r => r.rotation.z += dt * (r.userData.spd || .15) * b);

    pulses.forEach(p => {
      p.userData.life += dt * p.userData.spd * b;
      if (p.userData.life > 1) { p.userData.life = 0; p.rotation.x = Math.random()*Math.PI; p.rotation.y = Math.random()*Math.PI; }
      const l = p.userData.life;
      p.scale.setScalar(.7 + l*1.6);
      p.material.opacity = l < .2 ? (l/.2)*.55 : Math.max(0, 1 - (l-.2)/.8)*.55;
    });
    arcs.forEach(l => {
      l.userData.life += dt * l.userData.spd * b;
      if (l.userData.life > 1) { l.userData.life = 0; l.userData.spd = .4 + Math.random()*.6; setArc(l, 2.02); }
      l.material.opacity = Math.sin(l.userData.life * Math.PI) * .7;
    });
    sprites.forEach(s => {
      const u = s.userData;
      u.ph += dt * u.spd * b;
      const a = tAcc * u.orb, c = Math.cos(a), si = Math.sin(a);
      s.position.x = u.bp.x * c - u.bp.z * si;
      s.position.z = u.bp.x * si + u.bp.z * c;
      s.position.y = u.bp.y + Math.sin(u.ph)*.12;
      s.material.opacity = .35 + .55*(.5 + .5*Math.sin(u.ph*1.7));
    });

    // ---------- PORTAL POSITION (camera-anchored, faces camera) ----------
    cam.updateMatrixWorld();
    camR.setFromMatrixColumn(cam.matrixWorld, 0);
    camU.setFromMatrixColumn(cam.matrixWorld, 1);
    camF.set(-cam.matrixWorld.elements[8], -cam.matrixWorld.elements[9], -cam.matrixWorld.elements[10]).normalize();
    const pp = cam.position.clone()
      .add(camF.clone().multiplyScalar(3.5))
      .add(camR.clone().multiplyScalar(1.5))
      .add(camU.clone().multiplyScalar(-1.0));
    portal.position.copy(pp);
    portal.lookAt(cam.position);

    // ---------- PORTAL ANIMATION ----------
    const pf = portal.userData.flash;
    portal.userData.flash = Math.max(0, pf - dt*2);

    P.outer.rotation.z += dt * .25 * b;
    P.mid.rotation.z   -= dt * .6 * b;
    P.inner.rotation.z += dt * 1.0 * b;
    P.edge.rotation.z  -= dt * 1.6 * b;
    P.halo.rotation.z  += dt * 2.0 * b;

    P.sats.forEach(s => {
      const a = s.userData.angle + tAcc * s.userData.spd;
      s.position.set(Math.cos(a)*s.userData.rad, Math.sin(a)*s.userData.rad, 0);
      s.rotation.x += dt * 2 * b;
      s.rotation.y += dt * 1.5 * b;
    });
    P.struts.forEach((s,i) => { s.rotation.z = (i/4)*Math.PI + tAcc * .2 * b; });
    P.marker.position.x = Math.cos(tAcc * .8) * .1;
    P.marker.position.y = 1.15 + Math.sin(tAcc * 1.2) * .05;
    P.marker.rotation.z = tAcc * 1.5;

    // Hole pulse + flash
    const holeGlow = .15 + .1 * Math.sin(tAcc * 3) + pf * .7;
    P.halo.material.opacity = Math.min(1, holeGlow);
    P.edge.material.opacity = Math.min(1, .4 + pf * .6);
    P.mid.material.opacity = Math.min(1, .7 + pf * .3);
    P.hole.scale.setScalar(1 + pf * .3);

    // ---------- TASK CHIPS ----------
    for (let i = tasks.length-1; i >= 0; i--) {
      const t = tasks[i];
      if (t === carried) continue;
      if (t.flight) {
        t.flight.t += dt / t.flight.dur;
        if (t.flight.t >= 1) {
          scene.remove(t.sprite);
          try { t.sprite.material.map?.dispose(); t.sprite.material.dispose(); } catch {}
          tasks.splice(i,1); continue;
        }
        const e = 1 - Math.pow(1 - t.flight.t, 2);
        t.sprite.position.lerpVectors(t.flight.from, t.flight.to, e);
        t.sprite.material.opacity = 1 - t.flight.t;
        t.sprite.scale.setScalar(1.5 * (1 - t.flight.t * .9));
        continue;
      }
      const a = t.ba + tAcc * .15;
      t.sprite.position.set(Math.cos(a)*t.br, t.bh + Math.sin(tAcc + t.ph)*.15, Math.sin(a)*t.br);
      if (t !== hovered) t.sprite.scale.set(1.5, .375, 1);
    }

    comp.render();
    fr++; fpsT += dt;
    if (fpsT >= 1) { fpsEl.textContent = 'FPS: ' + fr; fr = 0; fpsT = 0; }
  } catch (e) { console.error('Frame:', e); }
}

try { buildOrb('performance'); ldr.classList.add('hidden'); }
catch (e) { console.error('Init:', e); ldr.textContent = 'INIT FAILED: ' + e.message; err('Init failed:\n' + e.message + '\n\n' + (e.stack||'')); }
loop();

addEventListener('resize', () => {
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  ren.setSize(innerWidth,innerHeight); comp.setSize(innerWidth,innerHeight);
  if (Q[quality].bl) bloom.setSize(innerWidth*.5, innerHeight*.5);
});
addEventListener('beforeunload', () => {
  try { speechSynthesis.cancel(); } catch {}
  try { sr?.stop(); } catch {}
});
</script>
</body>
</html>
